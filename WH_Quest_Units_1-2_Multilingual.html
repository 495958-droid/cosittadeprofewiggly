}

function confetti(k){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const cols=['#4B9CD3','#ffc83d','#1b8a4b','#d9541e','#cf2f6b'];
 for(let i=0;i<k;i++){const e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=cols[i%cols.length];e.style.animationDuration=(2+Math.random()*2)+'s';e.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),5000);}
}

}

  h+=`<div class="opts">${inst.order.map((oi,i)=>{let c='';if(fb){c=oi===q.a?'ok':(inst.sel===i?'no':'plain');}else if(inst.sel===i)c='sel';return `<button class="opt ${c}" data-act="sel" data-v="${i}"><span class="L">${LET[i]}</span><span>${tx(q.c[oi])}</span></button>`;}).join('')}</div>`;
 }else if(q.t==='tf'){
  h+=`<div class="tfrow">${[true,false].map(v=>{let c='';if(fb){c=v===q.a?'ok':(inst.sel===v?'no':'plain');}else if(inst.sel===v)c='sel';return `<button class="opt ${c}" data-act="sel" data-v="${v}">${v?ui('True'):ui('False')}</button>`;}).join('')}</div>`;
 }else if(q.t==='order'){
  h+=`<p class="hint">${ui('Tap the steps in the right order. Tap a placed step to remove it.')}</p><div class="slots">${q.items.map((_,k)=>{const p=inst.placed[k];const c=fb&&p!==undefined?(p===k?'ok':'no'):'';return `<div class="slot ${c}"><span class="n">${k+1}</span>${p!==undefined?`<button class="chipb" data-act="unplace" data-v="${k}" ${fb?'disabled':''}>${tx(q.items[p])}</button>`:''}</div>`;}).join('')}</div>`;
  if(!fb)h+=`<div class="pool">${inst.pool.filter(i=>!inst.placed.includes(i)).map(i=>`<button class="chipb" data-act="place" data-v="${i}">${tx(q.items[i])}</button>`).join('')}</div>`;
 }else{
  h+=`<p class="hint">${ui('Tap a left item, then tap its match on the right.')}</p><div class="mt"><div class="col">${q.pairs.map((p,l)=>{const m=inst.map[l]!==undefined;const c=fb?(inst.map[l]===l?'ok':'no'):(inst.selL===l?'sel':'');return `<button class="mi ${m?'m':''} ${c}" data-act="ml" data-v="${l}" ${fb?'disabled':''}><span class="pn">${m?l+1:''}</span>${tx(p[0])}</button>`;}).join('')}</div><div class="col">${inst.rorder.map(r=>{const l=Object.keys(inst.map).find(k=>inst.map[k]===r);const c=fb&&l!==undefined?(+l===r?'ok':'no'):'';return `<button class="mi ${l!==undefined?'m':''} ${c}" data-act="mr" data-v="${r}" ${fb?'disabled':''}><span class="pn">${l!==undefined?(+l+1):''}</span>${tx(q.pairs[r][1])}</button>`;}).join('')}</div></div>`;
 }
 return h;
}
function viewLesson(){
 const inst=L.queue[0],q=inst.q;
 const pct=Math.round(L.mastered.size/L.total*100);
 let ready=false;
 if(q.t==='mc'||q.t==='tf')ready=inst.sel!==null;
 else if(q.t==='order')ready=inst.placed.length===q.items.length;
 else ready=Object.keys(inst.map).length===q.pairs.length;
 const fb=L.phase==='fb';
 let foot='';
 if(!fb)foot=`<div class="dock"><div class="in"><button class="btn primary wide" data-act="check" ${ready?'':'disabled'}>${ui('Check')}</button></div></div>`;
 else{
  let ans='';
  if(!inst.ok){
   if(q.t==='mc')ans=`<p class="ans">${ui('Answer:')} ${tx(q.c[q.a])}</p>`;
   else if(q.t==='tf')ans=`<p class="ans">${ui(q.a?'The statement is true.':'The statement is false.')}</p>`;
   else if(q.t==='order')ans=`<p class="ans">${ui('Correct order:')}<br>${q.items.map((s,k)=>(k+1)+'. '+tx(s)).join('<br>')}</p>`;
   else ans=`<p class="ans">${q.pairs.map(p=>tx(p[0])+' = '+tx(p[1])).join('<br>')}</p>`;
  }
  foot=`<div class="fb ${inst.ok?'ok':'no'}"><div class="in"><h3>${inst.ok?ui(inst.praise):ui('Not quite. You will see this one again.')}</h3>${ans}<p>${tx(q.why)}</p><button class="btn primary wide" data-act="cont">${ui('Continue')}</button></div></div>`;
 }
 return `<div class="lhead"><button class="x" data-act="quit" aria-label="Quit">✕</button><div class="prog"><div style="width:${pct}%"></div></div><div class="hearts">${'♥'.repeat(L.hearts)}<span class="gone">${'♥'.repeat(3-L.hearts)}</span></div></div>
 <div class="lbody">${qBody(inst,fb)}<p style="text-align:end"><button class="cb" data-act="speak">🔊 English</button> ${P.lang!=='en'?`<button class="cb" data-act="speakT">🔊 ${LANGS.find(x=>x[0]===P.lang)[1]}</button>`:''}</p></div>${foot}`;
}
function viewResult(){
 const r=L.res;
 return `<div class="res"><div class="big">${[1,2,3].map(k=>`<span class="${k<=r.stars?'on':'off'}">★</span>`).join('')}</div><h2>${ui(L.practice?'Mistakes practiced!':'Zone complete!')}</h2>
 <div class="stat"><div><b>+${r.xp}</b>${ui('XP')}</div><div><b>${L.total}</b>${ui('questions')}</div><div><b>${L.lost}</b>${ui('hearts lost')}</div></div>
 ${r.newb.length?`<div class="newb"><b>${ui(r.newb.length>1?'New badges!':'New badge!')}</b><br>${r.newb.map(b=>b.ic+' '+ui(b.n)).join(' · ')}</div>`:''}
 <div class="btnrow">${r.next?`<button class="btn primary wide" data-act="play" data-v="${r.next}">${ui('Next zone')}</button>`:''}<button class="btn ${r.next?'':'primary'} wide" data-act="home">${ui('Back to map')}</button>${(!L.practice&&r.stars<3)?`<button class="btn wide" data-act="play" data-v="${L.zone}">${ui('Try for 3 stars')}</button>`:''}</div></div>`;
}
function viewFail(){
 return `<div class="res"><div class="big">💔</div><h2>${ui('Out of hearts')}</h2><p>${ui('No problem. Review the key ideas, then try again.')}</p><div class="btnrow">${L.practice?`<button class="btn primary wide" data-act="practice">${ui('Try again')}</button>`:`<button class="btn primary wide" data-act="learn" data-v="${L.zone}">${ui('Review the facts')}</button><button class="btn wide" data-act="play" data-v="${L.zone}">${ui('Try again')}</button>`}<button class="btn wide" data-act="home">${ui('Back to map')}</button></div></div>`;
}
function viewSpeed(){
 if(SP.phase==='intro')return `<div class="res"><div class="big">⚡</div><h2>${ui('Speed Round')}</h2><p>${ui('60 seconds. Answer as many as you can. Wrong answers do not cost time, but they go on your mistakes list.')}</p><p>${ui('Best score: {n}',{n:P.best})}</p><div class="btnrow"><button class="btn primary wide" data-act="spstart">${ui('Go!')}</button><button class="btn wide" data-act="home">${ui('Back')}</button></div></div>`;
 if(SP.phase==='end')return `<div class="res"><div class="big">⚡</div><h2>${ui('Score: {n}',{n:SP.score})}</h2><p>${SP.score>P.prevBest?ui('New best score!'):ui('Best score: {n}',{n:P.best})}</p>${SP.newb&&SP.newb.length?`<div class="newb"><b>${ui('New badge!')}</b><br>${SP.newb.map(b=>b.ic+' '+ui(b.n)).join(' · ')}</div>`:''}<div class="btnrow"><button class="btn primary wide" data-act="spstart">${ui('Play again')}</button><button class="btn wide" data-act="home">${ui('Back')}</button></div></div>`;
 const q=SP.q,fb=SP.picked!==null;
 const opts=q.t==='mc'?SP.order.map((oi,i)=>{let c='';if(fb)c=oi===q.a?'ok':(SP.picked===i?'no':'plain');return `<button class="opt ${c}" data-act="spick" data-v="${i}"><span class="L">${LET[i]}</span><span>${tx(q.c[oi])}</span></button>`;}).join(''):`<div class="tfrow">${[true,false].map(v=>{let c='';if(fb)c=v===q.a?'ok':(SP.picked===v?'no':'plain');return `<button class="opt ${c}" data-act="spick" data-v="${v}">${v?ui('True'):ui('False')}</button>`;}).join('')}</div>`;
 return `<div class="sprow"><span>${ui('Score: {n}',{n:SP.score})}</span><span id="spt">${SP.left}s</span></div><div class="timer ${SP.left<=10?'low':''}"><div id="spbar" style="width:${SP.left/60*100}%"></div></div>
 ${q.img?`<img class="qimg" src="${IMG[q.img]}" alt="" data-act="zoom" data-v="${q.img}">`:''}<div class="qtext">${tx(q.q)}</div>${q.t==='mc'?`<div class="opts">${opts}</div>`:opts}`;
}
function viewCards(){
 const list=F.list;const c=list[F.idx];
 return `<h2 style="margin-top:.3rem">${ui('Flashcards')}</h2><div class="chips"><button class="cb ${F.zone==='all'?'on':''}" data-act="cz" data-v="all">${ui('All')}</button>${ZONES.map((z,i)=>`<button class="cb ${F.zone===z.id?'on':''}" data-act="cz" data-v="${z.id}">${i+1}. ${z.icon}</button>`).join('')}</div>
 <p class="hint">${ui('Card {a} of {b}',{a:F.idx+1,b:list.length})} · ${tx(c.zn)}</p>
 <div class="card fcard ${F.flip?'back':''}" data-act="flip"><div><small>${ui(F.flip?'MEANING':'TERM')}</small>${tx(F.flip?c.m:c.t)}</div></div>
 <div class="btnrow" style="grid-template-columns:1fr 1fr 1fr 1fr"><button class="btn" data-act="fprev">${ui('Back')}</button><button class="btn primary" data-act="flip">${ui('Flip')}</button><button class="btn" data-act="fnext">${ui('Next')}</button><button class="btn" data-act="fshuf">${ui('Shuffle')}</button></div>`;
}
function render(){
 let h='';
 if(S==='home')h=viewHome();else if(S==='learn')h=viewLearn();else if(S==='lesson')h=viewLesson();else if(S==='result')h=viewResult();else if(S==='fail')h=viewFail();else if(S==='speed')h=viewSpeed();else if(S==='cards')h=viewCards();
 const app=$('#app');app.setAttribute('dir',dirOf(P.lang));app.innerHTML=h;
 document.documentElement.lang=P.lang==='zh'?'zh-Hans':P.lang;
 $('#ttl').textContent=u('World History Quest');document.title=u('World History Quest');
 $('#homebtn').textContent=u('Home');
 $('#topchip').textContent=P.days>1?('🔥 '+u('Day streak: {n}',{n:P.days})):u('{n} XP',{n:P.xp});
 window.scrollTo(0,0);
}


/* ---------- lesson logic ---------- */
function mkInst(q,retry){
 const i={q,retry:!!retry,sel:null,ok:false};
 if(q.t==='mc')i.order=shuffle(q.c.map((_,k)=>k));
 if(q.t==='order'){i.pool=shuffle(q.items.map((_,k)=>k));i.placed=[];}
 if(q.t==='match'){i.rorder=shuffle(q.pairs.map((_,k)=>k));i.map={};i.selL=null;}
 return i;
}
function startLesson(qs,zone,practice){
 stopT();
 L={zone,practice:!!practice,queue:qs.map(q=>mkInst(q)),total:qs.length,mastered:new Set(),hearts:3,lost:0,xp:0,streak:0,best:0,phase:'ask'};
 S='lesson';render();
}
function sel(v){const i=L.queue[0];if(L.phase!=='ask')return;i.sel=(i.q.t==='tf')?(v==='true'):+v;render();}
function check(){
 const inst=L.queue[0],q=inst.q;if(L.phase!=='ask')return;
 let ok=false;
 if(q.t==='mc'){if(inst.sel===null)return;ok=inst.order[inst.sel]===q.a;}
 else if(q.t==='tf'){if(inst.sel===null)return;ok=inst.sel===q.a;}
 else if(q.t==='order'){if(inst.placed.length!==q.items.length)return;ok=inst.placed.every((v,k)=>v===k);}
 else{if(Object.keys(inst.map).length!==q.pairs.length)return;ok=q.pairs.every((_,l)=>inst.map[l]===l);}
 inst.ok=ok;L.phase='fb';
 if(ok){inst.praise=['Correct!','Nice work!','You got it!','Exactly right!'][Math.floor(Math.random()*4)];L.xp+=inst.retry?5:10;L.streak++;L.best=Math.max(L.best,L.streak);L.mastered.add(q.id);P.missed=P.missed.filter(x=>x!==q.id);}
 else{L.hearts--;L.lost++;L.streak=0;if(!P.missed.includes(q.id))P.missed.push(q.id);L.queue.push(mkInst(q,true));}
 save();render();
}
function cont(){
 if(L.phase!=='fb')return;
 L.queue.shift();L.phase='ask';
 if(L.hearts<=0){S='fail';render();return;}
 if(!L.queue.length){finish();return;}
 render();
}
function finish(){
 const stars=L.lost===0?3:(L.lost===1?2:1);
 let xp=L.xp+20+(stars===3?10:0);
 P.maxStreak=Math.max(P.maxStreak,L.best);
 if(!L.practice)P.stars[L.zone]=Math.max(P.stars[L.zone]||0,stars);else P.practiced++;
 P.xp+=xp;
 const t=dstr(new Date());
 if(P.day!==t){P.days=(P.day===dstr(new Date(Date.now()-864e5)))?P.days+1:1;P.day=t;}
 const newb=checkBadges();save();
 const zi=ZONES.findIndex(z=>z.id===L.zone);
 L.res={stars,xp,newb,next:(!L.practice&&zi>=0&&zi<ZONES.length-1)?ZONES[zi+1].id:null};
 S='result';render();if(stars===3)confetti(60);else confetti(20);
}
/* ---------- speed round ---------- */
const SPQ=ALLQ.filter(q=>q.t==='mc'||q.t==='tf');
function spNext(){
 const q=SPQ[Math.floor(Math.random()*SPQ.length)];
 SP.q=q;SP.picked=null;SP.order=q.t==='mc'?shuffle(q.c.map((_,k)=>k)):null;
}
function spStart(){
 stopT();SP={phase:'play',score:0,left:60,t0:Date.now()};P.prevBest=P.best;spNext();S='speed';render();
 tid=setInterval(()=>{
  const left=Math.max(0,60-Math.floor((Date.now()-SP.t0)/1000));
  const el=$('#spt'),b=$('#spbar');
  if(left!==SP.left){SP.left=left;if(el)el.textContent=left+'s';if(b){b.style.width=(left/60*100)+'%';b.parentNode.classList.toggle('low',left<=10);}}
  if(left<=0){stopT();SP.phase='end';if(SP.score>P.best)P.best=SP.score;SP.newb=checkBadges();save();render();if(SP.score>=12)confetti(40);}
 },200);
}
function spPick(v){
 if(SP.phase!=='play'||SP.picked!==null)return;
 const q=SP.q;let ok;
 if(q.t==='mc'){SP.picked=+v;ok=SP.order[+v]===q.a;}else{SP.picked=(v==='true');ok=SP.picked===q.a;}
 if(ok)SP.score++;else if(!P.missed.includes(q.id))P.missed.push(q.id);
 save();render();
 setTimeout(()=>{if(SP&&SP.phase==='play'&&S==='speed'){spNext();render();}},ok?450:1100);
}
/* ---------- cards ---------- */
function cardList(zone){
 return ZONES.filter(z=>zone==='all'||z.id===zone).flatMap(z=>z.facts.map(f=>({t:f[0],m:f[1],zn:z.name})));
}

/* ---------- events ---------- */
const A={
 home(){stopT();S='home';render();},
 learn(el){stopT();F={zone:el.dataset.v};S='learn';render();},
 play(el){const z=ZONES.find(x=>x.id===el.dataset.v);startLesson(z.qs,z.id,false);},
 practice(){const ids=shuffle(P.missed).slice(0,8);const qs=ids.map(i=>QID[i]).filter(Boolean);if(qs.length)startLesson(qs,'practice',true);},
 speed(){stopT();SP={phase:'intro'};S='speed';render();},
 spstart:spStart,
 spick(el){spPick(el.dataset.v);},
 cards(){stopT();F={zone:'all',idx:0,flip:false};F.list=shuffle(cardList('all'));S='cards';render();},
 cz(el){F.zone=el.dataset.v;F.list=cardList(F.zone);F.idx=0;F.flip=false;render();},
 flip(){F.flip=!F.flip;render();},
 fnext(){F.idx=(F.idx+1)%F.list.length;F.flip=false;render();},
 fprev(){F.idx=(F.idx-1+F.list.length)%F.list.length;F.flip=false;render();},
 fshuf(){F.list=shuffle(F.list);F.idx=0;F.flip=false;render();},
 sel(el){sel(el.dataset.v);},
 check,cont,speak,speakT,
 place(el){const i=L.queue[0];if(L.phase!=='ask')return;i.placed.push(+el.dataset.v);render();},
 unplace(el){const i=L.queue[0];if(L.phase!=='ask')return;i.placed.splice(+el.dataset.v,1);render();},
 ml(el){const i=L.queue[0];if(L.phase!=='ask')return;const l=+el.dataset.v;if(i.map[l]!==undefined){delete i.map[l];}i.selL=l;render();},
 mr(el){const i=L.queue[0];if(L.phase!=='ask')return;const r=+el.dataset.v;
  const owner=Object.keys(i.map).find(k=>i.map[k]===r);
  if(i.selL===null){if(owner!==undefined){delete i.map[owner];render();}return;}
  if(owner!==undefined)delete i.map[owner];
  i.map[i.selL]=r;i.selL=null;render();},
 quit(){const m=document.createElement('div');m.className='modal';m.setAttribute('dir',dirOf(P.lang));m.innerHTML=`<div class="card"><h2 style="margin-top:0">${ui('Quit this lesson?')}</h2><p>${ui('Your progress in this lesson will be lost.')}</p><div class="btnrow"><button class="btn wide" data-act="stay">${ui('Keep going')}</button><button class="btn primary wide" data-act="leave">${ui('Quit')}</button></div></div>`;document.body.appendChild(m);},
 stay(){const m=document.querySelector('.modal');if(m)m.remove();},
 leave(){const m=document.querySelector('.modal');if(m)m.remove();S='home';render();},
 zoom(el){const z=document.createElement('div');z.className='zoom';z.innerHTML=`<img src="${IMG[el.dataset.v]}" alt="Enlarged">`;z.onclick=()=>z.remove();document.body.appendChild(z);}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el);}});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.sel==='lang'){P.lang=t.value;save();render();}
 if(t.dataset.chk==='showEN'){P.showEN=t.checked;save();render();}
});
document.addEventListener('keydown',e=>{
 const z=document.querySelector('.zoom');if(z&&(e.key==='Escape'||e.key==='Enter')){z.remove();return;}
 if(S==='lesson'&&L){
  const q=L.queue[0].q;
  if(e.key==='Enter'){e.preventDefault();if(L.phase==='fb')cont();else check();return;}
  if(L.phase==='ask'&&q.t==='mc'){const k=LET.indexOf(e.key.toUpperCase());if(e.key.length===1&&k>=0&&k<L.queue[0].order.length)sel(k);}
  if(L.phase==='ask'&&q.t==='tf'){if(e.key.toLowerCase()==='t')sel('true');if(e.key.toLowerCase()==='f')sel('false');}
 }else if(S==='cards'){if(e.key===' '||e.key==='Enter'){e.preventDefault();A.flip();}else if(e.key==='ArrowRight')A.fnext();else if(e.key==='ArrowLeft')A.fprev();}
});
render();
</script>
</body>
