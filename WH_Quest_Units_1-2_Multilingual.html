","Mezclar","¿Salir de esta lección?","Perderás tu avance en esta lección.","Seguir","Salir","Comienza la agricultura","Nómadas, la Revolución neolítica y la Media Luna Fértil","Nómadas","Personas que se mueven de un lugar a otro para buscar comida, agua y pastos para sus animales.","Cazadores-recolectores","Primeros humanos que cazaban animales y recogían plantas silvestres.","Revolución neolítica","El gran cambio de cazar y recolectar a cultivar la tierra.","Excedente","Comida de sobra. Permite que algunas personas hagan otros trabajos, como hacer cerámica o gobernar.","Asentamiento permanente","Una aldea donde la gente se queda porque cultiva alimentos cerca.","Media Luna Fértil","Una región curva de tierra rica en el suroeste de Asia donde comenzó la agricultura.","Un grupo de personas de la antigüedad recoge sus cosas y sigue a una manada de animales hacia pastos nuevos. ¿Por qué se mueven?","Para cubrir necesidades de supervivencia como comida, agua y pastos","Para cobrar impuestos a otras aldeas","Para construir un templo en una ciudad nueva","Para comerciar con Roma","Los nómadas se movían para cubrir sus necesidades de supervivencia. Su comida y agua dependían de la tierra a su alrededor.","¿Cuál fue el mayor cambio de la Revolución neolítica?","La gente empezó a cultivar y criar animales en lugar de solo cazar y recolectar","La gente inventó la imprenta","La gente construyó el primer imperio","La gente descubrió el fuego por primera vez","La Revolución neolítica es el comienzo de la agricultura. Cambió la forma de vivir de las personas.","¿Hecho o mentira? La agricultura permitió que la gente se quedara en un lugar y construyera aldeas permanentes.","Los cultivos crecen en un lugar, así que la gente pudo quedarse y construir aldeas cerca de sus campos.","Pon en orden: cómo la agricultura cambió la sociedad.","La gente empieza a cultivar","Las granjas producen comida de sobra (un excedente)","Algunas personas tienen otros trabajos, como alfarero o sacerdote","Las aldeas se convierten en ciudades","La agricultura creó un excedente. Con un excedente, no todos tenían que cultivar, así que los trabajos se especializaron y las ciudades crecieron.","Mira el mapa. ¿Qué ayudó a que la agricultura comenzara en la Media Luna Fértil?","Los ríos y el suelo fértil","Montañas altas en el centro","Un enorme desierto seco","Suelo congelado todo el año","La tierra cerca de los ríos Tigris y Éufrates tenía agua y suelo rico, ideal para los cultivos.","Une cada término con su significado.","Se mueven para buscar comida y agua","Comida de sobra","El comienzo de la agricultura","Cazaban animales y recogían plantas","Estas cuatro ideas explican cómo los humanos pasaron de vagar de un lugar a otro a vivir en un sitio fijo.","Civilizaciones de los valles fluviales","Mesopotamia, Egipto, el valle del Indo y la China Shang","Mesopotamia","\"La tierra entre los ríos\": el Tigris y el Éufrates.","Egipto","Creció a orillas del río Nilo. Gobernado por faraones.","Valle del Indo","Creció a orillas del río Indo. Conocido por sus ciudades planificadas.","China Shang","Creció a orillas del Huang He (río Amarillo).","Escritura cuneiforme","Escritura con marcas en forma de cuña sobre arcilla. Se inventó en Mesopotamia.","Características de una civilización","Ciudades, gobierno, religión, clases sociales, escritura, arte y arquitectura, y trabajos especializados.","Teocracia","Un gobierno dirigido por una autoridad religiosa. El faraón era rey y sumo sacerdote a la vez.","El mapa señala cuatro civilizaciones antiguas. ¿Qué ayudó a que todas crecieran?","Ríos cercanos que daban agua y suelo rico","Océanos cercanos donde comerciaban con Europa","Montañas que mantenían alejados a todos los extranjeros","Bosques espesos que daban madera","Las cuatro civilizaciones comenzaron en valles fluviales. Los ríos daban agua para los cultivos y las crecidas dejaban suelo fértil.","Une cada civilización con su río.","Río Nilo","Tigris y Éufrates","Río Indo","Huang He (río Amarillo)","Los nombres de los ríos son una pregunta favorita de los exámenes. Recuerda: cada civilización creció a orillas de su río.","Se cree que un rey es también un dios y el sumo sacerdote. ¿Qué dos tipos de gobierno describe esto?","Monarquía y teocracia","Democracia y república","Oligarquía y anarquía","Tribu y república","Un rey significa monarquía. Un gobernante que también es líder religioso significa teocracia.","¿Qué lista muestra características de una civilización?","Ciudades, gobierno, escritura y clases sociales","Cuevas, caza y fuego","Tiendas, rebaños y vida errante","Solo granjas y sin gobierno","Las civilizaciones tienen ciudades, gobierno, religión, clases sociales, escritura, arte y trabajos especializados.","¿Hecho o mentira? La escritura cuneiforme se inventó en Egipto.","La escritura cuneiforme vino de Mesopotamia (Sumer). Egipto usaba jeroglíficos.","Un dibujo maya muestra a un gobernante cargado mientras unos sirvientes caminan a su lado. ¿Qué característica de la civilización muestra?","Clases sociales","Un sistema de educación","Un código de leyes","Urbanización","Personas de distintos niveles (un gobernante y sus sirvientes) muestran clases sociales.","Pon en orden: cómo el Nilo ayudó a crecer a Egipto.","El Nilo se desborda cada año","Las crecidas dejan suelo fértil","Los agricultores producen comida de sobra","Crecen las ciudades y el gobierno","Las crecidas llevaron al éxito agrícola. El excedente de comida permitió ciudades y gobierno.","Grandes creencias e ideas","Confucio, budismo, hinduismo, judaísmo, cristianismo e islam","Confucio","Pensador chino. Enseñó conducta moral, respeto a los mayores y cumplir con el deber.","Budismo","Nació en la India con Siddhartha Gautama, el Buda. Lo difundieron monjes, comerciantes y gobernantes como Ashoka.","Hinduismo","Nació en la India. Cree en muchos dioses, la reencarnación y el karma.","Judaísmo","Creencia en un solo Dios (monoteísmo). Su texto sagrado es la Torá.","Cristianismo","Basado en Jesús de Nazaret. Se extendió por todo el Imperio romano.","Islam","Basado en el profeta Mahoma. Su libro sagrado es el Corán. Los fieles siguen los Cinco Pilares.","Un funcionario de la antigua China sigue a Confucio. ¿Qué comportamiento encaja?","Respetar a sus mayores y cumplir con su deber honestamente","Ignorar por completo al emperador","Poner sus propios intereses primero","Meditar para escapar del renacimiento","Confucio destacó la conducta moral, el respeto y el deber para formar una sociedad ordenada.","¿Qué afirmación explica cómo se difundió el budismo fuera de la India?","Los monjes viajaron con los comerciantes y algunos gobernantes enviaron misioneros","Los ejércitos obligaron a la gente a convertirse","Las imprentas hicieron miles de copias de las palabras de Buda","Los exploradores españoles lo llevaron en barco","El budismo se difundió pacíficamente por las rutas comerciales con monjes y comerciantes. El emperador Ashoka también apoyó misiones.","Une cada religión con una idea clave.","La Torá","El Corán","Reencarnación y karma","Jesús de Nazaret","Cada religión tiene su propio texto o figura central.","¿Hecho o mentira? El judaísmo, el cristianismo y el islam son todos monoteístas.","Monoteísmo es creer en un solo Dios. Estas tres religiones lo comparten.","¿Los seguidores de qué religión practican los Cinco Pilares?","Confucianismo","Los Cinco Pilares son la fe, la oración, la caridad, el ayuno en Ramadán y la peregrinación a La Meca.","Siddhartha Gautama es conocido como …","el Buda","Mahoma","Ashoka","Siddhartha Gautama se convirtió en el Buda, que significa \"el despierto\".","La antigua Grecia","Ciudades-estado, democracia, cultura y legado","Ciudad-estado (polis)","Una ciudad con su propio gobierno y leyes, como Atenas o Esparta.","Geografía de Grecia","Las montañas y las islas separaban a las comunidades, así que se formaron muchas ciudades-estado independientes.","Atenas","Cuna de la democracia directa. Solo los hombres adultos ciudadanos podían votar.","Esparta","Una sociedad militar que entrenaba a los niños para ser soldados.","Sócrates","Hacía preguntas y analizaba las respuestas para buscar la verdad.","Hipócrates","Estudió las enfermedades mediante la observación. Se le llama el \"padre de la medicina\".","Legado de Grecia","Democracia, filosofía, teatro, los Juegos Olímpicos y la arquitectura con columnas.","¿Por qué se formaron en Grecia muchas ciudades-estado independientes?","Las montañas y las islas separaban a las comunidades","Una enorme llanura plana unía toda la tierra","Un rey poderoso gobernaba todo","Los desiertos rodeaban cada ciudad","La tierra montañosa y las muchas islas hacían difícil viajar. Cada comunidad se gobernaba sola.","En la democracia ateniense, ¿quién podía votar?","Solo los hombres adultos ciudadanos","Todos los adultos de la ciudad","Solo la familia del rey","Solo los soldados","Las mujeres, los extranjeros y los esclavos no podían votar en Atenas.","¿Hecho o mentira? Esparta era una sociedad basada en el entrenamiento militar.","Los niños espartanos se entrenaban como soldados desde pequeños.","¿Qué nos dicen estas estatuas griegas sobre los valores de los griegos?","Valoraban la belleza y el equilibrio del cuerpo humano","Querían glorificar a un rey todopoderoso","Adoraban a un solo dios","Querían advertir sobre la vida después de la muerte","El arte griego solía celebrar el cuerpo humano con equilibrio y belleza.","Une cada persona o lugar con su descripción.","Hacía preguntas para encontrar la verdad","Estudió las enfermedades por observación","Democracia directa","Entrenamiento militar","Estos nombres muestran los aportes griegos al pensamiento, la medicina y el gobierno.","¿Cuál de estos es un legado de la antigua Grecia?","Los Juegos Olímpicos","La Gran Muralla","La escritura cuneiforme","Las pirámides","Los primeros Juegos Olímpicos se celebraron en Grecia. Muchas ideas modernas vienen de Grecia.","En Atenas las mujeres no podían votar, pero las espartanas podían tener propiedades. ¿Qué demuestra esto?","Las ciudades-estado griegas trataban a las mujeres de forma distinta","Todas las mujeres griegas tenían los mismos derechos que los hombres","Atenas daba más libertad a las mujeres que Esparta","Grecia no tenía clases sociales","Las ciudades-estado eran independientes, así que sus reglas sobre las mujeres eran distintas. Ninguna les daba plenos derechos políticos.","Roma","República, Imperio, logros romanos y la caída de Roma","República romana","Los líderes eran elegidos y un Senado ayudaba a gobernar. No había rey.","Imperio romano","Gobernado por emperadores, comenzando con Augusto.","Pax Romana","Unos 200 años de paz y estabilidad en el Imperio romano.","Derecho romano","Ideas como \"inocente hasta que se pruebe lo contrario\" todavía influyen en las leyes de hoy.","Ingeniería romana","Caminos, puentes y acueductos que llevaban agua a las ciudades.","Latín","El idioma de Roma. Es la raíz del español, el francés y el italiano.","Caída de Roma","Líderes débiles, corrupción, guerras civiles, problemas económicos e invasiones.","En la República romana, ¿quién tenía el poder?","Funcionarios elegidos y el Senado","Un solo rey todopoderoso","Solo los sacerdotes","Generales extranjeros","La República era el gobierno de líderes elegidos y un Senado, no de un rey.","Durante la Pax Romana, ¿qué es lo más probable que pasara?","El comercio y los viajes aumentaron gracias a la paz y los buenos caminos","El comercio se detuvo por la guerra constante","Roma perdió sus caminos","El Senado desapareció","Pax Romana significa paz romana. La paz y los caminos ayudaron a crecer al comercio.","Pon estos hechos en orden.","Augusto se convierte en el primer emperador","Cae el Imperio de Occidente","Roma pasó de República a Imperio, disfrutó de paz y luego cayó en Occidente.","¿Hecho o mentira? Los ingenieros romanos construyeron caminos y acueductos que duraron cientos de años.","Muchos caminos y acueductos romanos estaban tan bien hechos que partes siguen en pie hoy.","¿Qué problema dañó tanto a Roma como a la China Han antes de su caída?","Líderes débiles y corruptos y ataques de grupos externos","Demasiada democracia","Demasiadas cosechas","Un fin repentino de todo el comercio","Los dos imperios sufrieron corrupción, inestabilidad política e invasiones.","En el Imperio romano, las mujeres podían tener propiedades y manejar negocios, pero seguían bajo la tutela de un hombre. ¿Qué conclusión encaja?","Los derechos de las mujeres crecieron, pero no eran iguales a los de los hombres","Mujeres y hombres tenían los mismos derechos","Los derechos de las mujeres desaparecieron por completo","Las mujeres podían llegar a ser emperadora","La evidencia muestra que los derechos crecieron y que quedaron límites.","Une cada idea romana con su significado.","Raíz del español, el francés y el italiano","Acueducto","Llevaba agua a las ciudades","Inocente hasta que se pruebe lo contrario","Senado","Aconsejaba y hacía las leyes en la República","Los romanos dejaron ideas duraderas en el idioma, la ingeniería y las leyes.","Europa medieval","La Iglesia, el Imperio bizantino, el feudalismo y los señoríos","Iglesia católica romana","Dirigida por el papa. La institución más fuerte de la Europa occidental medieval.","Imperio bizantino","El Imperio romano de Oriente. Capital: Constantinopla. El cristianismo era la religión del Estado.","Iglesia ortodoxa oriental","La iglesia cristiana del mundo bizantino, dirigida desde Constantinopla.","Feudalismo","Los señores daban tierras a los caballeros a cambio de lealtad y servicio. Los campesinos trabajaban la tierra.","Señorío","Una propiedad que se bastaba a sí misma. Su economía se basaba en la agricultura.","Siervo","Un campesino que trabajaba la tierra del señor y no podía irse.","Carlomagno","Rey de los francos coronado emperador por el papa en el año 800.","Sin un rey fuerte cerca, una aldea acude a su sacerdote en busca de ayuda y orden. Esto muestra que la Iglesia era …","una fuerza estabilizadora cuando los gobiernos eran débiles","una fuerza que evitaba los asuntos sociales","algo separado del gobierno","un grupo que dividía a Europa","La Iglesia daba a la gente orden, ayuda y una fe compartida.","Mira este señorío. ¿Cuál era la principal fuente de riqueza?","La agricultura y la cría de animales","La banca y los préstamos","Los talleres de gremios en las ciudades","El comercio de ultramar","La mayor parte del señorío son campos y pastos. Los siervos cultivaban alimentos y el molino molía el grano.","Ordena el sistema feudal de arriba hacia abajo.","Rey","Señores y nobles","Caballeros","Campesinos y siervos","El rey daba tierras a los señores, los señores a los caballeros, y los campesinos trabajaban la tierra.","¿Qué imperio mantuvo el cristianismo como religión del Estado y tenía su capital en Constantinopla?","El Imperio bizantino","El Imperio mongol","El Imperio Han","El Imperio maurya","El gobierno apoyaba al cristianismo, lo que ayudó a que se extendiera.","¿Hecho o mentira? El papa era el líder de la Iglesia ortodoxa oriental.","El papa dirigía la Iglesia católica romana. La Iglesia ortodoxa se dirigía desde Constantinopla.","Tierra a cambio de lealtad y servicio","Propiedad agrícola que se bastaba a sí misma","Coronado emperador en el año 800","Capital en Constantinopla","Estas son las ideas centrales de la Europa medieval.","Un siervo en un señorío medieval era …","un campesino que trabajaba la tierra del señor a cambio de protección","un caballero que defendía el castillo","un comerciante que viajaba por la Ruta de la Seda","un sacerdote que cobraba impuestos","Los siervos cultivaban la tierra del señor y él los protegía, pero por lo general no podían irse.","El islam y la Edad de Oro","La expansión del islam, el aprendizaje en Bagdad y la difusión cultural","El profeta que inició el islam en Arabia.","Corán","El libro sagrado del islam.","Cinco Pilares","Fe, oración, caridad, ayuno en Ramadán, peregrinación a La Meca.","Califato","Un imperio musulmán dirigido por un califa. Extendió el islam por tres continentes.","Edad de Oro del islam","Una época de grandes avances en matemáticas, medicina y astronomía, sobre todo en Bagdad.","Casa de la Sabiduría","Centro de Bagdad donde los sabios traducían libros y añadían ideas nuevas.","Álgebra","Matemáticas que avanzaron los sabios musulmanes. Todavía usamos ese sistema hoy.","¿Qué afirmación respalda mejor el mapa?","El islam se extendió desde Arabia por etapas por el norte de África y Asia","El islam se quedó en Arabia","El territorio del islam se redujo entre 750 y 1250","Más de la mitad del mundo era musulmana en 1250","El mapa muestra cómo el sombreado se mueve hacia afuera desde la primera zona. No muestra el número de habitantes.","¿Qué logro de la Edad de Oro te ayuda a hacer matemáticas hoy?","El álgebra y nuestro sistema de numeración","Los acueductos","La pólvora","Los sabios musulmanes se basaron en las matemáticas griegas, indias y persas y avanzaron el álgebra.","¿Hecho o mentira? El Corán es el libro sagrado del islam.","El Corán es central en el islam.","El profeta que inició el islam","Libro sagrado del islam","La Meca","Ciudad de peregrinación","Bagdad","Centro de saber","Estos nombres muestran dónde y cómo nació y creció el islam.","Los sabios de Bagdad tradujeron libros griegos, persas e indios y añadieron ideas nuevas. Esto es un ejemplo de …","difusión cultural","una teocracia","un excedente","feudalismo","La difusión cultural es la expansión de ideas entre culturas.","¿Cuál es uno de los Cinco Pilares del islam?","Ayunar durante el Ramadán","Construir pirámides","Un sacrificio diario de animales","Llevar una corona","Los pilares son la fe, la oración, la caridad, el ayuno y la peregrinación a La Meca.","Las Cruzadas y la peste negra","Cómo terminó la Europa medieval","Las Cruzadas","Guerras (1096 a 1291) de europeos cristianos para tomar la Tierra Santa.","Efectos de las Cruzadas","Más comercio, difusión cultural, feudalismo más débil y reyes más fuertes.","Ciudades-estado italianas","Venecia y Génova se enriquecieron con el comercio con Oriente.","Peste negra","Una plaga en la década de 1340 que se extendió desde Asia por las rutas comerciales.","Efectos de la peste negra","Murieron muchos. Con menos trabajadores, el sistema de señoríos se debilitó.","Guerra de los Cien Años","Inglaterra contra Francia (1337 a 1453). Las nuevas armas debilitaron a los caballeros.","El fin de la Edad Media","Las Cruzadas, la peste negra y la Guerra de los Cien Años ayudaron a terminar la Europa medieval.","Un caballero francés vuelve de Oriente Medio con especias, seda y nuevas ideas sobre medicina. ¿Qué demuestra esto?","Difusión cultural","El comienzo de la Revolución Industrial","Europa quedando aislada","El comienzo de las colonias en América","El contacto entre Europa y las tierras musulmanas movió bienes e ideas de un lado a otro.","Pon en orden: los efectos de las Cruzadas.","Se abren las rutas comerciales","Llegan a Europa más productos de lujo de Asia","Las ciudades comerciales italianas se enriquecen","Crece la economía de Europa occidental","El comercio se abrió, llegaron los productos, las ciudades comerciales crecieron y la economía creció.","Las flechas del mapa sugieren que la plaga llegó a Europa por …","las rutas comerciales de Asia","las rutas de los ataques vikingos","las rutas oceánicas desde América","los pasos de montaña del sur de África","Los comerciantes llevaron la enfermedad por las rutas comerciales desde Asia.","¿Hecho o mentira? Como la peste negra mató a tantos trabajadores, los señoríos y los señores perdieron poder.","Con menos trabajadores, los sobrevivientes pudieron exigir mejor paga. Eso debilitó el sistema de señoríos.","Une cada hecho o lugar con su descripción.","Guerras para tomar la Tierra Santa","Plaga que se extendió por las rutas comerciales","Inglaterra contra Francia","Venecia y Génova","Ricas ciudades comerciales italianas","Estos cuatro elementos explican el fin de la Edad Media.","¿Qué tres hechos ayudaron a terminar la Europa medieval?","Las Cruzadas, la peste negra y la Guerra de los Cien Años","La Pax Romana, la Ruta de la Seda y la Edad de Oro","La Revolución neolítica, la escritura cuneiforme y las pirámides","El feudalismo, los señoríos y los monasterios","Estos tres hechos debilitaron el feudalismo y cambiaron Europa.","¿Cómo ayudó la Guerra de los Cien Años a terminar la Edad Media?","Las nuevas armas debilitaron a los caballeros y los reyes ganaron poder","Fortaleció el feudalismo","Terminó con todo el comercio","Trajo de vuelta el Imperio romano","Los arcos largos y los cañones hicieron menos importantes a los caballeros con armadura, y las naciones se fortalecieron.","Tang, Song y los mongoles","Las dinastías chinas, la Ruta de la Seda y el Imperio mongol","Dinastía Tang","Construyó caminos y canales. Creció el comercio por la Ruta de la Seda. Capital: Chang'an.","Dinastía Song","Armas de pólvora, imprenta de tipos móviles, brújula y papel moneda.","Ruta de la Seda","Rutas comerciales por Asia que unían China con el Mediterráneo.","Gengis Kan","Unió a las tribus nómadas mongolas y construyó un imperio enorme.","Kublai Kan","Nieto de Gengis. Primer gobernante no chino de toda China. Fundó la dinastía Yuan.","Marco Polo","Viajero veneciano. Su libro aumentó el interés de Europa por Asia.","Efectos de los mongoles","Rusia pagó tributo. China: dinastía Yuan. Mundo islámico: Bagdad destruida en 1258. El comercio fue más seguro.","¿Qué dificultad enfrentaría con más probabilidad un comerciante de la Ruta de la Seda en este mapa?","Largas distancias por desiertos y montañas","Viaje fácil por un solo camino pavimentado","Viajes cortos entre puertos cercanos","Ninguna necesidad de ciudades en el camino","El mapa muestra rutas que cruzan distancias enormes y tierras difíciles.","Une cada gobernante o dinastía con aquello por lo que es conocido.","Tang","Caminos y canales","Song","Pólvora e imprenta de tipos móviles","Unió a las tribus mongolas","Fundó la dinastía Yuan","Estas cuatro son las personas y épocas principales de esta lección.","¿Hecho o mentira? Los mongoles hicieron más seguros los viajes y el comercio por Asia.","El control mongol de enormes territorios protegió las rutas comerciales. Personas, bienes e ideas viajaron más lejos.","¿Qué le pasó a Bagdad en 1258?","Los mongoles capturaron y destruyeron gran parte de la ciudad","Los cruzados la capturaron","La peste negra la dejó vacía","Se convirtió en la capital de China","La invasión mongola del mundo islámico acabó con el califato abasí.","Después de que se difundiera el libro de Marco Polo, muchos europeos …","se interesaron más por las culturas y los productos de Asia","dejaron de comerciar con Asia","se mudaron a China","se olvidaron de la Ruta de la Seda","Los escritos de los viajeros pueden despertar curiosidad y comercio.","¿Qué se usaba mucho en la China Song?","La imprenta de tipos móviles","La escritura cuneiforme en arcilla","Los acueductos romanos","Los barcos vikingos","La China Song imprimía con tipos móviles y usaba armas de pólvora.","¿Cómo cambiaron los mongoles a Rusia?","Gobernaron a los príncipes rusos y cobraron tributo durante unos 200 años","Construyeron nuevas ciudades rusas con ingenieros romanos","Hicieron de Rusia el centro de la Ruta de la Seda","Nunca llegaron a Rusia","La Horda de Oro mongola dominó Rusia y los príncipes rusos pagaron tributo.","Pon esto en orden.","Gengis Kan une a los mongoles","Los mongoles conquistan gran parte de Asia","Kublai Kan funda la dinastía Yuan","Marco Polo visita China y escribe un libro","El imperio creció con Gengis, llegó a China con Kublai, y Marco Polo le contó a Europa sobre él."],"fr":["Quête d'histoire mondiale","Accueil","{n} XP","Jours de suite : {n}","Apprenti du temps","Scribe","Explorateur","Érudit","Historien","Maître historien","{n} XP · encore {m} pour le niveau suivant","{n} XP · niveau maximal !","Afficher l'anglais avec la traduction","Tour rapide","Cartes mémoire","Mes erreurs","Ta quête","Apprendre","Jouer","Badges","Premiers pas","Termine une zone","Sans faute","Obtiens 3 étoiles dans une zone","En feu","Réponds juste 6 fois de suite","Éclair","Marque 12 au Tour rapide","Correcteur d'erreurs","Termine un entraînement sur les erreurs","3 jours de suite","Étudie 3 jours de suite","Voyageur du monde","Termine les 9 zones","3 étoiles dans chaque zone","Ta progression est enregistrée sur cet appareil. Conseil : lis d'abord la page Apprendre, puis joue. Les questions ratées reviennent jusqu'à ce que tu réussisses.","Lis ces idées clés, puis commence la leçon.","Commencer la leçon","Retour","Choisis la meilleure réponse","Vrai ou faux","Remets dans l'ordre","Associe les paires","Deuxième essai","Touche les étapes dans le bon ordre. Touche une étape placée pour la retirer.","Touche un élément à gauche, puis touche son associé à droite.","Vrai","Faux","Vérifier","Continuer","Réponse :","L'affirmation est vraie.","L'affirmation est fausse.","Bon ordre :","Pas tout à fait. Tu reverras cette question.","Correct !","Bon travail !","Tu as réussi !","Exactement !","Zone terminée !","Erreurs travaillées !","XP","questions","cœurs perdus","Nouveau badge !","Nouveaux badges !","Zone suivante","Retour à la carte","Réessayer pour 3 étoiles","Plus de cœurs","Ce n'est pas grave. Relis les idées clés et réessaie.","Revoir les faits","Réessayer","60 secondes. Réponds à autant de questions que possible. Les erreurs ne font pas perdre de temps, mais elles sont ajoutées à ta liste d'erreurs.","Meilleur score : {n}","C'est parti !","Score : {n}","Nouveau meilleur score !","Rejouer","Tout","Carte {a} sur {b}","SENS","TERME","Retourner","Suivant","Mélanger","Quitter cette leçon ?","Tu perdras ta progression dans cette leçon.","Continuer","Quitter","Les débuts de l'agriculture","Les nomades, la révolution néolithique et le Croissant fertile","Nomades","Personnes qui se déplacent d'un endroit à l'autre pour trouver de la nourriture, de l'eau et des pâturages pour leurs animaux.","Chasseurs-cueilleurs","Premiers humains qui chassaient des animaux et cueillaient des plantes sauvages.","Révolution néolithique","Le grand passage de la chasse et de la cueillette à la culture de la terre.","Surplus","Nourriture en plus. Il permet à certaines personnes de faire d'autres métiers, comme la poterie ou le gouvernement.","Établissement permanent","Un village où les gens restent parce qu'ils cultivent leur nourriture à proximité.","Croissant fertile","Une région courbe et riche du sud-ouest de l'Asie où l'agriculture a commencé.","Un groupe de personnes de l'Antiquité fait ses bagages et suit un troupeau vers de nouveaux pâturages. Pourquoi se déplacent-ils ?","Pour répondre à leurs besoins de survie comme la nourriture, l'eau et les pâturages","Pour collecter des impôts auprès d'autres villages","Pour construire un temple dans une nouvelle ville","Pour commercer avec Rome","Les nomades se déplaçaient pour répondre à leurs besoins de survie. Leur nourriture et leur eau dépendaient des terres autour d'eux.","Quel a été le plus grand changement de la révolution néolithique ?","Les gens ont commencé à cultiver et à élever des animaux au lieu de seulement chasser et cueillir","Les gens ont inventé l'imprimerie","Les gens ont construit le premier empire","Les gens ont découvert le feu pour la première fois","La révolution néolithique est le début de l'agriculture. Elle a changé la façon de vivre des gens.","Vrai ou inventé ? L'agriculture a permis aux gens de rester au même endroit et de construire des villages permanents.","Les cultures poussent au même endroit, donc les gens ont pu rester et construire des villages près de leurs champs.","Remets dans l'ordre : comment l'agriculture a changé la société.","Les gens commencent à cultiver","Les fermes produisent de la nourriture en plus (un surplus)","Certaines personnes ont d'autres métiers, comme potier ou prêtre","Les villages deviennent des villes","L'agriculture a créé un surplus. Avec un surplus, tout le monde n'avait pas besoin de cultiver, donc les métiers se sont spécialisés et les villes ont grandi.","Regarde la carte. Qu'est-ce qui a aidé l'agriculture à commencer dans le Croissant fertile ?","Les fleuves et le sol fertile","De hautes montagnes au centre","Un immense désert sec","Un sol gelé toute l'année","Les terres près du Tigre et de l'Euphrate avaient de l'eau et un sol riche, idéal pour les cultures.","Associe chaque terme à son sens.","Se déplacent pour trouver nourriture et eau","Nourriture en plus","Le début de l'agriculture","Chassaient des animaux et cueillaient des plantes","Ces quatre idées expliquent comment les humains sont passés d'une vie errante à une vie au même endroit.","Les civilisations des vallées fluviales","La Mésopotamie, l'Égypte, la vallée de l'Indus et la Chine des Shang","Mésopotamie","« La terre entre les fleuves » : le Tigre et l'Euphrate.","Égypte","S'est développée le long du Nil. Gouvernée par des pharaons.","Vallée de l'Indus","S'est développée le long de l'Indus. Connue pour ses villes planifiées.","Chine des Shang","S'est développée le long du Huang He (fleuve Jaune).","Écriture cunéiforme","Écriture faite de marques en forme de coin sur des tablettes d'argile. Inventée en Mésopotamie.","Caractéristiques d'une civilisation","Villes, gouvernement, religion, classes sociales, écriture, art et architecture, et métiers spécialisés.","Théocratie","Un gouvernement dirigé par une autorité religieuse. Le pharaon était à la fois roi et grand prêtre.","La carte montre quatre civilisations anciennes. Qu'est-ce qui les a toutes aidées à grandir ?","Des fleuves proches qui apportaient de l'eau et un sol riche","Des océans proches où elles commerçaient avec l'Europe","Des montagnes qui tenaient tous les étrangers à l'écart","Des forêts épaisses qui fournissaient du bois","Les quatre civilisations ont commencé dans des vallées fluviales. Les fleuves apportaient l'eau pour les cultures et les crues laissaient un sol fertile.","Associe chaque civilisation à son fleuve.","Le Nil","Le Tigre et l'Euphrate","L'Indus","Le Huang He (fleuve Jaune)","Les noms des fleuves sont une question favorite des contrôles. Souviens-toi : chaque civilisation s'est développée le long de son fleuve.","On croit qu'un roi est à la fois un dieu et le grand prêtre. Quels deux types de gouvernement cela décrit-il ?","Monarchie et théocratie","Démocratie et république","Oligarchie et anarchie","Tribu et république","Un roi signifie monarchie. Un dirigeant qui est aussi chef religieux signifie théocratie.","Quelle liste montre des caractéristiques d'une civilisation ?","Villes, gouvernement, écriture et classes sociales","Grottes, chasse et feu","Tentes, troupeaux et vie errante","Seulement des fermes et aucun gouvernement","Les civilisations ont des villes, un gouvernement, une religion, des classes sociales, l'écriture, l'art et des métiers spécialisés.","Vrai ou inventé ? L'écriture cunéiforme a été inventée en Égypte.","L'écriture cunéiforme vient de Mésopotamie (Sumer). L'Égypte utilisait les hiéroglyphes.","Une image maya montre un dirigeant porté pendant que des serviteurs marchent à côté. Quelle caractéristique de civilisation cela montre-t-il ?","Les classes sociales","Un système d'éducation","Un code de lois","L'urbanisation","Des personnes de niveaux différents (un dirigeant et des serviteurs) montrent des classes sociales.","Remets dans l'ordre : comment le Nil a aidé l'Égypte à grandir.","Le Nil déborde chaque année","Les crues laissent un sol riche","Les agriculteurs produisent de la nourriture en plus","Les villes et le gouvernement se développent","Les crues ont mené au succès agricole. Le surplus de nourriture a permis des villes et un gouvernement.","Grandes croyances et idées","Confucius, le bouddhisme, l'hindouisme, le judaïsme, le christianisme et l'islam","Confucius","Penseur chinois. Il enseignait la conduite morale, le respect des aînés et l'accomplissement du devoir.","Bouddhisme","Né en Inde avec Siddhartha Gautama, le Bouddha. Répandu par des moines, des marchands et des dirigeants comme Ashoka.","Hindouisme","Né en Inde. Croit en de nombreux dieux, en la réincarnation et au karma.","Judaïsme","Croyance en un seul Dieu (monothéisme). Son texte sacré est la Torah.","Christianisme","Fondé sur Jésus de Nazareth. S'est répandu dans tout l'Empire romain.","Islam","Fondé sur le prophète Mahomet. Son livre sacré est le Coran. Les fidèles suivent les Cinq Piliers.","Un fonctionnaire de la Chine ancienne suit Confucius. Quel comportement correspond ?","Respecter ses aînés et accomplir son devoir honnêtement","Ignorer complètement l'empereur","Mettre ses propres intérêts en premier","Méditer pour échapper à la renaissance","Confucius insistait sur la conduite morale, le respect et le devoir pour bâtir une société ordonnée.","Quelle affirmation explique comment le bouddhisme s'est répandu hors de l'Inde ?","Des moines ont voyagé avec des marchands et certains dirigeants ont envoyé des missionnaires","Des armées ont forcé les gens à se convertir","Des imprimeries ont fait des milliers de copies des paroles du Bouddha","Des explorateurs espagnols l'ont transporté en bateau","Le bouddhisme s'est répandu pacifiquement le long des routes commerciales avec des moines et des marchands. L'empereur Ashoka a aussi soutenu des missions.","Associe chaque religion à une idée clé.","La Torah","Le Coran","Réincarnation et karma","Jésus de Nazareth","Chaque religion a son propre texte ou sa propre figure centrale.","Vrai ou inventé ? Le judaïsme, le christianisme et l'islam sont tous monothéistes.","Le monothéisme, c'est croire en un seul Dieu. Ces trois religions ont cela en commun.","Les fidèles de quelle religion pratiquent les Cinq Piliers ?","Le confucianisme","Les Cinq Piliers sont la foi, la prière, l'aumône, le jeûne du ramadan et le pèlerinage à La Mecque.","Siddhartha Gautama est connu sous le nom de …","le Bouddha","Mahomet","Ashoka","Siddhartha Gautama est devenu le Bouddha, ce qui signifie « l'éveillé ».","La Grèce antique","Cités-États, démocratie, culture et héritage","Cité-État (polis)","Une ville avec son propre gouvernement et ses propres lois, comme Athènes ou Sparte.","Géographie de la Grèce","Les montagnes et les îles séparaient les communautés, donc de nombreuses cités-États indépendantes se sont formées.","Athènes","Berceau de la démocratie directe. Seuls les hommes adultes citoyens pouvaient voter.","Sparte","Une société militaire qui entraînait les garçons à devenir des guerriers.","Socrate","Il posait des questions et analysait les réponses pour chercher la vérité.","Hippocrate","Il a étudié les maladies par l'observation. On l'appelle le « père de la médecine ».","Héritage de la Grèce","Démocratie, philosophie, théâtre, Jeux olympiques et architecture à colonnes.","Pourquoi de nombreuses cités-États indépendantes se sont-elles formées en Grèce ?","Les montagnes et les îles séparaient les communautés","Une immense plaine plate reliait tout le pays","Un roi puissant gouvernait tout","Des déserts entouraient chaque ville","Le relief montagneux et les nombreuses îles rendaient les voyages difficiles. Chaque communauté se gouvernait elle-même.","Dans la démocratie athénienne, qui pouvait voter ?","Seulement les hommes adultes citoyens","Tous les adultes de la ville","Seulement la famille du roi","Seulement les soldats","Les femmes, les étrangers et les esclaves ne pouvaient pas voter à Athènes.","Vrai ou inventé ? Sparte était une société fondée sur l'entraînement militaire.","Les garçons spartiates étaient entraînés comme soldats dès leur plus jeune âge.","Que nous disent ces statues grecques sur les valeurs des Grecs ?","Ils valorisaient la beauté et l'équilibre du corps humain","Ils voulaient glorifier un roi tout-puissant","Ils adoraient un seul dieu","Ils voulaient avertir au sujet de la vie après la mort","L'art grec célébrait souvent le corps humain avec équilibre et beauté.","Associe chaque personne ou lieu à sa description.","Posait des questions pour trouver la vérité","A étudié les maladies par l'observation","Démocratie directe","Entraînement militaire","Ces noms montrent les contributions grecques à la pensée, à la médecine et au gouvernement.","Lequel de ces éléments est un héritage de la Grèce antique ?","Les Jeux olympiques","La Grande Muraille","L'écriture cunéiforme","Les pyramides","Les premiers Jeux olympiques ont eu lieu en Grèce. Beaucoup d'idées modernes viennent de Grèce.","À Athènes, les femmes ne pouvaient pas voter, mais les Spartiates pouvaient posséder des biens. Que montre cela ?","Les cités-États grecques traitaient les femmes de façons différentes","Toutes les femmes grecques avaient les mêmes droits que les hommes","Athènes donnait plus de liberté aux femmes que Sparte","La Grèce n'avait pas de classes sociales","Les cités-États étaient indépendantes, donc leurs règles sur les femmes différaient. Aucune ne leur donnait tous les droits politiques.","Rome","La République, l'Empire, les réalisations romaines et la chute de Rome","République romaine","Les dirigeants étaient élus et un Sénat aidait à gouverner. Il n'y avait pas de roi.","Empire romain","Gouverné par des empereurs, à commencer par Auguste.","Pax Romana","Environ 200 ans de paix et de stabilité dans l'Empire romain.","Droit romain","Des idées comme « innocent jusqu'à preuve du contraire » influencent encore les lois d'aujourd'hui.","Ingénierie romaine","Routes, ponts et aqueducs qui amenaient l'eau dans les villes.","Latin","La langue de Rome. C'est la racine de l'espagnol, du français et de l'italien.","Chute de Rome","Dirigeants faibles, corruption, guerres civiles, problèmes économiques et invasions.","Dans la République romaine, qui détenait le pouvoir ?","Des fonctionnaires élus et le Sénat","Un seul roi tout-puissant","Seulement les prêtres","Des généraux étrangers","La République était le gouvernement de dirigeants élus et d'un Sénat, pas d'un roi.","Pendant la Pax Romana, que s'est-il probablement passé ?","Le commerce et les voyages ont augmenté grâce à la paix et aux bonnes routes","Le commerce s'est arrêté à cause de la guerre constante","Rome a perdu ses routes","Le Sénat a disparu","Pax Romana signifie paix romaine. La paix et les routes ont aidé le commerce à se développer.","Remets ces événements dans l'ordre.","Auguste devient le premier empereur","L'Empire d'Occident tombe","Rome est passée de République à Empire, a connu la paix, puis est tombée en Occident.","Vrai ou inventé ? Les ingénieurs romains ont construit des routes et des aqueducs qui ont duré des centaines d'années.","Beaucoup de routes et d'aqueducs romains étaient si bien construits que certaines parties tiennent encore aujourd'hui.","Quel problème a affaibli à la fois Rome et la Chine des Han avant leur chute ?","Des dirigeants faibles et corrompus et des attaques de groupes extérieurs","Trop de démocratie","Trop de récoltes","Une fin soudaine de tout le commerce","Les deux empires ont subi la corruption, l'instabilité politique et les invasions.","Dans l'Empire romain, les femmes pouvaient posséder des biens et diriger des affaires, mais restaient sous la tutelle d'un homme. Quelle conclusion correspond ?","Les droits des femmes ont augmenté, mais n'étaient pas égaux à ceux des hommes","Les femmes et les hommes avaient les mêmes droits","Les droits des femmes ont complètement disparu","Les femmes pouvaient devenir impératrices","Les preuves montrent que les droits ont augmenté et que des limites sont restées.","Associe chaque idée romaine à son sens.","Racine de l'espagnol, du français et de l'italien","Aqueduc","Amenait l'eau dans les villes","Innocent jusqu'à preuve du contraire","Sénat","Conseillait et faisait les lois sous la République","Les Romains ont laissé des idées durables en matière de langue, d'ingénierie et de droit.","L'Europe médiévale","L'Église, l'Empire byzantin, la féodalité et les seigneuries","Église catholique romaine","Dirigée par le pape. L'institution la plus puissante de l'Europe occidentale médiévale.","Empire byzantin","L'Empire romain d'Orient. Capitale : Constantinople. Le christianisme était la religion d'État.","Église orthodoxe orientale","L'Église chrétienne du monde byzantin, dirigée depuis Constantinople.","Féodalité","Les seigneurs donnaient des terres aux chevaliers en échange de loyauté et de service. Les paysans travaillaient la terre.","Seigneurie","Un domaine autosuffisant. Son économie reposait sur l'agriculture.","Serf","Un paysan qui travaillait la terre du seigneur et ne pouvait pas partir.","Charlemagne","Roi des Francs couronné empereur par le pape en l'an 800.","Sans roi puissant à proximité, un village se tourne vers son prêtre pour obtenir de l'aide et de l'ordre. Cela montre que l'Église était …","une force stabilisatrice quand les gouvernements étaient faibles","une force qui évitait les affaires sociales","séparée du gouvernement","un groupe qui divisait l'Europe","L'Église donnait aux gens de l'ordre, de l'aide et une foi commune.","Regarde cette seigneurie. Quelle était la principale source de richesse ?","L'agriculture et l'élevage","La banque et les prêts","Les ateliers de corporations dans les villes","Le commerce outre-mer","La plus grande partie de la seigneurie est faite de champs et de pâturages. Les serfs cultivaient la nourriture et le moulin moulait le grain.","Classe le système féodal de haut en bas.","Roi","Seigneurs et nobles","Chevaliers","Paysans et serfs","Le roi donnait des terres aux seigneurs, les seigneurs aux chevaliers, et les paysans travaillaient la terre.","Quel empire a gardé le christianisme comme religion d'État et avait sa capitale à Constantinople ?","L'Empire byzantin","L'Empire mongol","L'Empire han","L'Empire maurya","Le gouvernement soutenait le christianisme, ce qui a aidé à sa diffusion.","Vrai ou inventé ? Le pape était le chef de l'Église orthodoxe orientale.","Le pape dirigeait l'Église catholique romaine. L'Église orthodoxe était dirigée depuis Constantinople.","Terre en échange de loyauté et de service","Domaine agricole autosuffisant","Couronné empereur en l'an 800","Capitale à Constantinople","Ce sont les idées centrales de l'Europe médiévale.","Un serf dans une seigneurie médiévale était …","un paysan qui travaillait la terre du seigneur en échange de protection","un chevalier qui défendait le château","un marchand qui voyageait sur la route de la soie","un prêtre qui collectait les impôts","Les serfs cultivaient la terre du seigneur et il les protégeait, mais ils ne pouvaient généralement pas partir.","L'islam et l'âge d'or","L'expansion de l'islam, le savoir à Bagdad et la diffusion culturelle","Le prophète qui a fondé l'islam en Arabie.","Coran","Le livre sacré de l'islam.","Cinq Piliers","Foi, prière, aumône, jeûne du ramadan, pèlerinage à La Mecque.","Califat","Un empire musulman dirigé par un calife. Il a répandu l'islam sur trois continents.","Âge d'or de l'islam","Une période de grands progrès en mathématiques, en médecine et en astronomie, surtout à Bagdad.","Maison de la sagesse","Un centre à Bagdad où des savants traduisaient des livres et ajoutaient de nouvelles idées.","Algèbre","Des mathématiques que les savants musulmans ont fait progresser. Nous utilisons encore ce système aujourd'hui.","Quelle affirmation la carte soutient-elle le mieux ?","L'islam s'est répandu depuis l'Arabie par étapes vers l'Afrique du Nord et l'Asie","L'islam est resté en Arabie","Le territoire de l'islam a rétréci entre 750 et 1250","Plus de la moitié du monde était musulmane en 1250","La carte montre l'ombre qui s'étend à partir de la première zone. Elle ne montre pas le nombre d'habitants.","Quelle réalisation de l'âge d'or t'aide à faire des maths aujourd'hui ?","L'algèbre et notre système de nombres","Les aqueducs","La poudre à canon","Les savants musulmans se sont appuyés sur les mathématiques grecques, indiennes et perses et ont fait progresser l'algèbre.","Vrai ou inventé ? Le Coran est le livre sacré de l'islam.","Le Coran est central dans l'islam.","Le prophète qui a fondé l'islam","Livre sacré de l'islam","La Mecque","Ville de pèlerinage","Bagdad","Centre du savoir","Ces noms montrent où et comment l'islam est né et a grandi.","Des savants de Bagdad ont traduit des livres grecs, persans et indiens et ajouté de nouvelles idées. C'est un exemple de …","diffusion culturelle","théocratie","surplus","féodalité","La diffusion culturelle est la propagation d'idées entre cultures.","Lequel est l'un des Cinq Piliers de l'islam ?","Jeûner pendant le ramadan","Construire des pyramides","Un sacrifice quotidien d'animaux","Porter une couronne","Les piliers sont la foi, la prière, l'aumône, le jeûne et le pèlerinage à La Mecque.","Les croisades et la peste noire","Comment l'Europe médiévale a pris fin","Les croisades","Guerres (1096 à 1291) menées par des Européens chrétiens pour prendre la Terre sainte.","Effets des croisades","Plus de commerce, diffusion culturelle, féodalité affaiblie et rois plus forts.","Cités-États italiennes","Venise et Gênes se sont enrichies grâce au commerce avec l'Orient.","Peste noire","Une épidémie des années 1340 qui s'est répandue depuis l'Asie par les routes commerciales.","Effets de la peste noire","Beaucoup sont morts. Moins de travailleurs ont affaibli le système des seigneuries.","Guerre de Cent Ans","L'Angleterre contre la France (1337 à 1453). De nouvelles armes ont affaibli les chevaliers.","La fin du Moyen Âge","Les croisades, la peste noire et la guerre de Cent Ans ont aidé à mettre fin à l'Europe médiévale.","Un chevalier français revient du Moyen-Orient avec des épices, de la soie et de nouvelles idées sur la médecine. Que montre cela ?","La diffusion culturelle","Le début de la révolution industrielle","L'Europe qui s'isole","Le début des colonies en Amérique","Le contact entre l'Europe et les terres musulmanes a fait circuler des biens et des idées dans les deux sens.","Remets dans l'ordre : les effets des croisades.","Les routes commerciales s'ouvrent","Plus de produits de luxe d'Asie arrivent en Europe","Les villes marchandes italiennes s'enrichissent","L'économie de l'Europe occidentale se développe","Le commerce s'est ouvert, les produits sont arrivés, les villes marchandes ont grandi et l'économie s'est développée.","Les flèches sur la carte suggèrent que la peste est arrivée en Europe par …","les routes commerciales d'Asie","les routes des raids vikings","les routes océaniques depuis l'Amérique","les cols de montagne du sud de l'Afrique","Les marchands ont apporté la maladie par les routes commerciales depuis l'Asie.","Vrai ou inventé ? Comme la peste noire a tué beaucoup de travailleurs, les seigneuries et les seigneurs ont perdu du pouvoir.","Moins de travailleurs signifiait que les survivants pouvaient exiger un meilleur salaire. Cela a affaibli le système des seigneuries.","Associe chaque événement ou lieu à sa description.","Guerres pour prendre la Terre sainte","Épidémie répandue par les routes commerciales","L'Angleterre contre la France","Venise et Gênes","Riches villes marchandes italiennes","Ces quatre éléments expliquent la fin du Moyen Âge.","Quels trois événements ont aidé à mettre fin à l'Europe médiévale ?","Les croisades, la peste noire et la guerre de Cent Ans","La Pax Romana, la route de la soie et l'âge d'or","La révolution néolithique, l'écriture cunéiforme et les pyramides","La féodalité, les seigneuries et les monastères","Ces trois événements ont affaibli la féodalité et changé l'Europe.","Comment la guerre de Cent Ans a-t-elle aidé à mettre fin au Moyen Âge ?","De nouvelles armes ont affaibli les chevaliers et les rois ont gagné du pouvoir","Elle a renforcé la féodalité","Elle a mis fin à tout le commerce","Elle a ramené l'Empire romain","Les arcs longs et les canons ont rendu les chevaliers en armure moins importants, et les nations sont devenues plus fortes.","Tang, Song et les Mong manse nan peyi End ak Siddhartha Gautama, Boudha a. Mòn, machann ak dirijan tankou Ashoka te gaye l.","Endouyis","Te kòmanse nan peyi End. Kwè nan anpil dye, reyenkanasyon ak karma.","Jidayis","Kwayans nan yon sèl Dye (monoteyis). Tèks sakre a se Tora a.","Kretyen","Baze sou Jezi Nazarèt. Li te gaye toupatou nan Anpi women an.","Islam","Baze sou pwofèt Mohamè. Liv sakre a se Koran an. Swivan yo swiv Senk Pilye yo.","Yon ofisyèl nan Lachin ansyen swiv Konfisyis. Ki konpòtman ki koresponn?","Respekte granmoun li yo epi fè devwa li onètman","Inyore anperè a nèt","Mete enterè pa li an premye","Medite pou chape anba renesans","Konfisyis te mete aksan sou bon konduit, respè ak devwa pou bati yon sosyete òdone.","Ki deklarasyon ki eksplike kijan Boudis la te gaye pi lwen peyi End?","Mòn yo te vwayaje ak machann yo, epi kèk dirijan te voye misyonè","Lame yo te fòse moun konvèti","Près yo te fè dè milye kopi pawòl Boudha a","Eksploratè Panyòl yo te pote l sou bato","Boudis la te gaye anpè sou wout kòmès ak mòn ak machann. Anperè Ashoka te sipòte misyon tou.","Konekte chak relijyon ak yon lide kle.","Tora a","Koran an","Reyenkanasyon ak karma","Jezi Nazarèt","Chak relijyon gen pwòp tèks oswa figi santral li.","Verite oswa Manti? Jidayis, Kretyen ak Islam tout se monoteyis.","Monoteyis se kwè nan yon sèl Dye. Twa relijyon sa yo pataje sa.","Swivan ki relijyon pratike Senk Pilye yo?","Konfisyanis","Senk Pilye yo se lafwa, lapriyè, charite, jèn nan Ramadan ak pèlerinaj nan La Mèk.","Siddhartha Gautama konnen kòm …","Boudha a","Mohamè","Ashoka","Siddhartha Gautama te vin Boudha a, sa ki vle di 'moun ki reveye a.'","Grès Ansyen","Vil-eta, demokrasi, kilti ak eritaj","Vil-eta (polis)","Yon vil ki gen pwòp gouvènman ak lwa li, tankou Atèn oswa Sparta.","Jeyografi Grès","Mòn ak zile te separe kominote yo, kidonk anpil vil-eta endepandan te fòme.","Atèn","Kote demokrasi dirèk la te soti. Sèlman gason sitwayen adilt te kapab vote.","Sparta","Yon sosyete militè ki te antrene ti gason pou yo vin sòlda.","Sokrat","Li te poze kesyon epi analize repons pou chèche verite a.","Ipokrat","Li te itilize obsèvasyon pou etidye maladi. Yo rele l \"papa medsin\".","Eritaj Grès","Demokrasi, filozofi, teyat, Jwèt Olenpik yo ak achitekti ak kolòn.","Poukisa anpil vil-eta endepandan te devlope nan Grès?","Mòn ak zile te separe kominote yo","Yon gwo plenn plat te ini tout peyi a","Yon sèl gwo wa te dirije tout bagay","Dezè te antoure chak vil","Tè ki rèd ak anpil zile te fè vwayaj difisil. Chak kominote te gouvène tèt li.","Nan demokrasi Atèn lan, ki moun ki te kapab vote?","Sèlman gason sitwayen adilt","Tout adilt nan vil la","Sèlman fanmi wa a","Sèlman sòlda yo","Fanm, etranje ak esklav pa t kapab vote nan Atèn.","Verite oswa Manti? Sparta se te yon sosyete ki baze sou antrennman militè.","Ti gason Spartiyat yo te antrene kòm sòlda depi yo piti.","Kisa estati grèk sa yo di nou sou valè grèk yo?","Yo te bay valè ak bote ak ekilib kò moun","Yo te vle glorifye yon wa ki gen tout pouvwa","Yo te adore yon sèl dye","Yo te vle avèti moun sou lavi apre lanmò","Atizay grèk la souvan te selebre kò moun ak ekilib ak bote.","Konekte chak moun oswa kote ak deskripsyon li.","Li te poze kesyon pou jwenn verite a","Li te etidye maladi pa obsèvasyon","Demokrasi dirèk","Antrennman militè","Non sa yo montre kontribisyon grèk yo nan panse, medsin ak gouvènman.","Ki nan sa yo ki se yon eritaj Grès ansyen?","Jwèt Olenpik yo","Gwo Miray la","Ekriti kinèfòm","Piramid yo","Premye Jwèt Olenpik yo te fèt nan Grès. Anpil lide modèn soti nan Grès.","Fanm nan Atèn pa t kapab vote, men fanm Spartiyat yo te kapab posede pwopriyete. Kisa sa montre?","Vil-eta grèk yo te trete fanm yo yon fason diferan","Tout fanm grèk te gen menm dwa ak gason","Atèn te bay fanm plis libète pase Sparta","Grès pa t gen klas sosyal","Vil-eta yo te endepandan, kidonk règ yo sou fanm yo te diferan. Okenn nan yo pa t bay fanm tout dwa politik.","Wòm","Repiblik, Anpi, reyalizasyon women yo ak chit Wòm","Repiblik women","Yo te eli lidè yo epi yon Sena te ede gouvène. Pa t gen wa.","Anpi women","Anperè te dirije, kòmanse ak Ogis.","Pax Romana","Anviwon 200 an lapè ak estabilite nan Anpi women an.","Lwa women","Lide tankou \"inosan jiskaske yo pwouve li koupab\" toujou fòme lwa jodi a.","Enjenyri women","Wout, pon ak akedik ki te pote dlo nan vil yo.","Laten","Lang Wòm. Li se rasin Panyòl, Fransè ak Italyen.","Chit Wòm","Move lidè, koripsyon, lagè sivil, pwoblèm ekonomik ak envazyon.","Anba Repiblik women an, ki moun ki te gen pouvwa?","Ofisyèl eli yo ak Sena a","Yon sèl wa ki gen tout pouvwa","Sèlman prèt","Jeneral etranje","Repiblik la se te gouvènman lidè eli ak yon Sena, pa yon wa.","Pandan Pax Romana a, kisa ki pi gen chans pase?","Kòmès ak vwayaj te ogmante gras ak lapè ak bon wout","Kòmès te sispann paske te toujou gen lagè","Wòm te pèdi wout li yo","Sena a te disparèt","Pax Romana vle di lapè women. Lapè ak wout te ede kòmès grandi.","Mete evènman sa yo nan lòd.","Ogis vin premye anperè a","Anpi lwès la tonbe","Wòm te pase de Repiblik a Anpi a, te gen lapè, epi answit li te tonbe nan lwès.","Verite oswa Manti? Enjenyè women yo te bati wout ak akedik ki te dire plizyè santèn ane.","Anpil wout ak akedik women te tèlman byen bati ke kèk pati toujou kanpe jodi a.","Ki pwoblèm ki te fè mal Wòm ak Lachin Han anvan yo te tonbe?","Lidè fèb ak koripsyon ak atak soti nan gwoup deyò","Twòp demokrasi","Twòp rekòt","Yon bout toudenkou nan tout kòmès","De anpi yo te fè fas ak koripsyon, enstabilite politik ak envazyon.","Anba Anpi women an, fanm te kapab posede pwopriyete epi dirije biznis, men yo te toujou anba tutèl yon gason. Ki konklizyon ki koresponn?","Dwa fanm yo te grandi, men yo pa t egal ak dwa gason","Fanm ak gason te gen menm dwa","Dwa fanm yo te disparèt nèt","Fanm te kapab vin anperè","Prèv la montre dwa ki te grandi ak limit ki te rete.","Konekte chak lide women ak siyifikasyon li.","Rasin Panyòl, Fransè ak Italyen","Akedik","Te pote dlo nan vil yo","Inosan jiskaske yo pwouve li koupab","Sena","Te konseye epi te fè lwa nan Repiblik la","Women yo te kite lide ki dire nan lang, enjenyri ak lwa.","Ewòp Medyeval","Legliz la, Anpi Bizantin an, fewodalis ak domèn yo","Legliz Katolik Women","Dirije pa Pap la. Enstitisyon ki pi fò nan Ewòp lwès medyeval la.","Anpi Bizantin","Anpi women lès la. Kapital: Konstantinòp. Kretyen se te relijyon eta a.","Legliz Otodòks Lès","Legliz kretyen mond bizantin an, dirije soti Konstantinòp.","Fewodalis","Senyè yo te bay chevalye yo tè an echanj pou fidelite ak sèvis. Peyizan yo te travay tè a.","Domèn","Yon pwopriyete ki te sifi pou tèt li. Ekonomi li te baze sou agrikilti.","Sèf","Yon peyizan ki te travay tè senyè a epi ki pa t kapab ale.","Charlemagne","Wa Frank ki te kouwone anperè pa Pap la nan ane 800.","San yon gwo wa tou pre, yon vilaj ale kay prèt li pou chèche èd ak lòd. Sa a montre Legliz la te …","yon fòs ki te kenbe bagay yo stab lè gouvènman yo te fèb","yon fòs ki te evite zafè sosyal","separe de gouvènman an","yon gwoup ki te divize Ewòp","Legliz la te bay moun lòd, èd ak yon lafwa yo pataje.","Gade domèn sa a. Ki te pi gwo sous richès?","Agrikilti ak elvaj bèt","Labank ak prè","Atelye asosyasyon metye nan vil yo","Kòmès lòt bò lanmè","Pi gwo pati domèn nan se jaden ak patiraj. Sèf yo te kiltive manje epi moulen an te moulen grenn yo.","Mete sistèm fewodal la nan lòd soti anwo al anba.","Wa","Senyè ak nòb","Chevalye","Peyizan ak sèf","Wa a te bay senyè yo tè, senyè yo bay chevalye yo, epi peyizan yo te travay tè a.","Ki anpi ki te kenbe Kretyen kòm relijyon eta a epi ki te gen kapital li nan Konstantinòp?","Anpi Bizantin an","Anpi Mongòl la","Anpi Han an","Anpi Maurya a","Gouvènman an te sipòte Kretyen, sa ki te ede l gaye.","Verite oswa Manti? Pap la se te lidè Legliz Otodòks Lès la.","Pap la te dirije Legliz Katolik Women an. Legliz Otodòks la te dirije soti Konstantinòp.","Tè an echanj pou fidelite ak sèvis","Pwopriyete agrikòl ki te sifi pou tèt li","Kouwone anperè nan ane 800","Kapital nan Konstantinòp","Sa yo se lide santral Ewòp medyeval la.","Yon sèf sou yon domèn medyeval se te …","yon peyizan ki te travay tè senyè a an echanj pou pwoteksyon","yon chevalye ki te defann chato a","yon machann ki te vwayaje sou Wout Swa a","yon prèt ki te kolekte taks","Sèf yo te kiltive tè senyè a epi li te pwoteje yo, men yo pa t konn kapab ale.","Islam ak Laj Dò a","Gaye Islam, aprantisaj nan Bagdad ak difizyon kiltirèl","Pwofèt ki te kòmanse Islam nan Arabi.","Koran","Liv sakre Islam lan.","Senk Pilye yo","Lafwa, lapriyè, charite, jèn nan Ramadan, pèlerinaj nan La Mèk.","Kalifa","Yon anpi mizilman ki dirije pa yon kalif. Li te gaye Islam sou twa kontinan.","Laj Dò Islam lan","Yon tan gwo pwogrè nan matematik, medsin ak astwonomi, sitou nan Bagdad.","Kay Sajès la","Sant nan Bagdad kote save yo te tradui liv epi ajoute nouvo lide.","Aljèb","Matematik ke save mizilman yo te fè avanse. Nou toujou itilize sistèm nan jodi a.","Ki deklarasyon kat la sipòte pi byen?","Islam te gaye soti nan Arabi pa etap atravè Nò Afrik ak Azi","Islam te rete nan Arabi","Teritwa Islam lan te retresi ant 750 ak 1250","Plis pase mwatye mond lan te mizilman an 1250","Kat la montre lonbraj la ap deplase soti nan premye zòn nan. Li pa montre kantite moun.","Ki reyalizasyon Laj Dò a ede w fè matematik jodi a?","Aljèb ak sistèm chif nou yo","Akedik","Pouv","Save mizilman yo te bati sou matematik grèk, endyen ak pèsan epi te fè aljèb avanse.","Verite oswa Manti? Koran an se liv sakre Islam lan.","Koran an santral nan Islam.","Pwofèt ki te kòmanse Islam","Liv sakre Islam lan","La Mèk","Vil pèlerinaj","Bagdad","Sant konesans","Non sa yo montre ki kote ak kijan Islam te kòmanse epi grandi.","Save nan Bagdad te tradui liv grèk, pèsan ak endyen epi ajoute nouvo lide. Sa a se yon egzanp …","difizyon kiltirèl","yon teokrasi","yon sipli","fewodalis","Difizyon kiltirèl se gaye lide ant kilti yo.","Ki youn nan Senk Pilye Islam yo?","Jenn pandan Ramadan","Bati piramid","Sakrifis bèt chak jou","Mete yon kouwòn","Pilye yo se lafwa, lapriyè, charite, jèn ak pèlerinaj nan La Mèk.","Kwazad yo ak Lanmò Nwa a","Kijan Ewòp medyeval la te fini","Kwazad yo","Lagè (1096 rive 1291) pa Ewopeyen kretyen pou pran Tè Sent lan.","Efè Kwazad yo","Plis kòmès, difizyon kiltirèl, fewodalis ki vin pi fèb ak wa ki vin pi fò.","Vil-eta italyen yo","Venis ak Jèn te vin rich gras ak kòmès ak Lès la.","Lanmò Nwa","Yon epidemi nan ane 1340 yo ki te gaye soti nan Azi sou wout kòmès yo.","Efè Lanmò Nwa a","Anpil moun te mouri. Mwens travayè te febli sistèm domèn nan.","Lagè San Ane","Angletè kont Frans (1337 rive 1453). Nouvo zam te febli chevalye yo.","Fen Mwayennaj la","Kwazad yo, Lanmò Nwa a ak Lagè San Ane a tout te ede fini Ewòp medyeval la.","Yon chevalye franse retounen soti nan Mwayen Oryan ak epis, swa ak nouvo lide sou medsin. Kisa sa montre?","Difizyon kiltirèl","Kòmansman Revolisyon Endistriyèl la","Ewòp ki vin izole","Kòmansman koloni nan Amerik yo","Kontak ant Ewòp ak peyi mizilman yo te deplase machandiz ak lide toupatou.","Mete yo nan lòd: efè Kwazad yo.","Wout kòmès yo louvri","Plis machandiz liks soti Azi rive Ewòp","Vil kòmès italyen yo vin rich","Ekonomi Ewòp lwès la grandi","Kòmès te louvri, machandiz te rive, vil kòmès yo te grandi, epi ekonomi an te grandi.","Flèch yo sou kat la sigjere epidemi an te rive an Ewòp sou …","wout kòmès soti Azi","wout atak Viking yo","wout oseyan soti Amerik yo","pas mòn soti nan sid Afrik","Machann yo te pote maladi a sou wout kòmès soti Azi.","Verite oswa Manti? Paske Lanmò Nwa a te touye anpil travayè, domèn yo ak senyè yo te pèdi pouvwa.","Mwens travayè te vle di moun ki te siviv yo te kapab mande pi bon peman. Sa te febli sistèm domèn nan.","Konekte chak evènman oswa kote ak deskripsyon li.","Lagè pou pran Tè Sent lan","Epidemi ki te gaye sou wout kòmès","Angletè kont Frans","Venis ak Jèn","Vil kòmès italyen ki rich","Kat eleman sa yo eksplike fen Mwayennaj la.","Ki twa evènman ki te ede mete fen nan Ewòp medyeval la?","Kwazad yo, Lanmò Nwa a ak Lagè San Ane a","Pax Romana a, Wout Swa a ak Laj Dò a","Revolisyon Neyolitik la, kinèfòm ak piramid yo","Fewodalis, domèn ak monastè","Twa evènman sa yo te febli fewodalis epi chanje Ewòp.","Kijan Lagè San Ane a te ede fini Mwayennaj la?","Nouvo zam te febli chevalye yo, epi wa yo te vin gen plis pouvwa","Li te fè fewodalis vin pi fò","Li te fini tout kòmès","Li te mennen Anpi women an tounen","Gwo banza ak kanon te fè chevalye ak ami yo vin mwens enpòtan, epi nasyon yo te vin pi fò.","Tang, Song ak Mongòl yo","Dinasti chinwa yo, Wout Swa a ak Anpi Mongòl la","Dinasti Tang","Li te bati wout ak kanal. Kòmès sou Wout Swa a te grandi. Kapital: Chang'an.","Dinasti Song","Zam ak pouv, enprimri ak tip mobil, bousòl ak lajan papye.","Wout Swa a","Wout kòmès atravè Azi ki te lye Lachin ak Lamè Mediterane.","Jenjis Kan","Li te ini tribi nomad Mongòl yo epi li te bati yon gwo anpi.","Koublayi Kan","Pitit pitit Jenjis. Premye dirijan ki pa chinwa pou tout Lachin. Li te fonde dinasti Yuan.","Marco Polo","Vwayajè venisyen. Liv li a te ogmante enterè Ewòp pou Azi.","Efè Mongòl yo","Larisi te peye tribi. Lachin: dinasti Yuan. Mond Islamik la: Bagdad detwi an 1258. Kòmès te vin pi an sekirite.","Ki defi yon machann sou Wout Swa a nan kat sa a ta pi gen chans rankontre?","Gwo distans nan dezè ak mòn","Vwayaj fasil sou yon sèl wout pave","Ti vwayaj ant pò ki tou pre","Pa gen bezwen pou vil sou wout la","Kat la montre wout ki travèse gwo distans ak tè difisil.","Konekte chak dirijan oswa dinasti ak sa li konnen pou li.","Tang","Wout ak kanal","Song","Pouv ak enprimri ak tip mobil","Li te ini tribi Mongòl yo","Li te fonde dinasti Yuan","Kat sa yo se moun ak peryòd prensipal leson sa a.","Verite oswa Manti? Mongòl yo te fè vwayaj ak kòmès atravè Azi vin pi an sekirite.","Kontwòl Mongòl yo sou gwo zòn te pwoteje wout kòmès yo. Moun, machandiz ak lide te vwayaje pi lwen.","Kisa ki te rive Bagdad an 1258?","Mongòl yo te pran epi detwi yon gwo pati nan vil la","Kwazad yo te pran l","Lanmò Nwa a te vide l","Li te vin kapital Lachin","Envazyon Mongòl la nan mond Islamik la te mete fen nan Kalifa Abasid la.","Apre liv Marco Polo a te gaye, anpil Ewopeyen …","te vin plis enterese nan kilti ak machandiz Azi","te sispann fè kòmès ak Azi","te deplase al Lachin","te bliye Wout Swa a","Sa vwayajè yo ekri ka fè moun kiryè epi ankouraje kòmès.","Ki sa ki te itilize anpil nan Lachin Song lan?","Enprimri ak tip mobil","Ekriti kinèfòm sou ajil","Akedik women yo","Bato Viking yo","Lachin Song te enprime ak tip mobil epi te itilize zam ak pouv.","Kijan Mongòl yo te chanje Larisi?","Yo te dirije prens ris yo epi te kolekte tribi pandan anviwon 200 an","Yo te bati nouvo vil nan Larisi ak enjenyè women","Yo te fè Larisi sant Wout Swa a","Yo pa t janm rive Larisi","Gwo Lame Dò Mongòl la te domine Larisi, epi prens ris yo te peye tribi.","Mete sa yo nan lòd.","Jenjis Kan ini Mongòl yo","Mongòl yo konkeri yon gwo pati nan Azi","Koublayi Kan fonde dinasti Yuan","Marco Polo vizite Lachin epi li ekri yon liv","Anpi a te grandi anba Jenjis, li te rive Lachin anba Koublayi, epi Marco Polo te di Ewòp sou li."],"vi":["Nhiệm vụ Lịch sử Thế giới","Trang chủ","{n} XP","Chuỗi ngày: {n}","Học trò Thời gian","Thư lại","Nhà thám hiểm","Học giả","Sử gia","Bậc thầy Sử học","{n} XP · còn {m} để lên cấp","{n} XP · cấp cao nhất!","Hiện tiếng Anh cùng với bản dịch","Vòng Tốc độ","Thẻ ghi nhớ","Lỗi của tôi","Nhiệm vụ của bạn","Học","Chơi","Huy hiệu","Bước Đầu Tiên","Hoàn thành một khu vực","Hoàn hảo","Đạt 3 sao ở một khu vực","Bùng Cháy","Trả lời đúng liên tiếp 6 câu","Nhanh như Chớp","Đạt 12 điểm ở Vòng Tốc độ","Người Sửa Lỗi","Hoàn thành một bài luyện lỗi","Chuỗi 3 Ngày","Học 3 ngày liên tiếp","Lữ khách Thế giới","Hoàn thành cả 9 khu vực","3 sao ở mọi khu vực","Tiến trình của bạn được lưu trên thiết bị này. Mẹo: đọc trang Học trước, rồi mới chơi. Câu nào sai sẽ quay lại cho đến khi bạn trả lời đúng.","Hãy đọc các ý chính này, rồi bắt đầu bài học.","Bắt đầu bài học","Quay lại","Chọn câu trả lời đúng nhất","Đúng hay sai","Sắp xếp theo thứ tự","Ghép cặp","Lần thử thứ hai","Chạm vào các bước theo đúng thứ tự. Chạm vào bước đã đặt để bỏ ra.","Chạm vào một mục bên trái, rồi chạm vào mục tương ứng bên phải.","Đúng","Sai","Kiểm tra","Tiếp tục","Đáp án:","Câu này đúng.","Câu này sai.","Thứ tự đúng:","Chưa chính xác. Bạn sẽ gặp lại câu này.","Chính xác!","Làm tốt lắm!","Bạn làm được rồi!","Đúng rồi!","Hoàn thành khu vực!","Đã luyện xong các lỗi!","XP","câu hỏi","tim đã mất","Huy hiệu mới!","Các huy hiệu mới!","Khu vực tiếp theo","Về bản đồ","Thử lại để được 3 sao","Hết tim","Không sao đâu. Hãy xem lại các ý chính rồi thử lại.","Xem lại kiến thức","Thử lại","60 giây. Trả lời càng nhiều càng tốt. Trả lời sai không bị trừ thời gian nhưng sẽ được lưu vào danh sách lỗi của bạn.","Điểm cao nhất: {n}","Bắt đầu!","Điểm: {n}","Kỷ lục mới!","Chơi lại","Tất cả","Thẻ {a} trên {b}","NGHĨA","THUẬT NGỮ","Lật","Tiếp","Xáo trộn","Thoát bài học này?","Bạn sẽ mất tiến trình trong bài học này.","Tiếp tục","Thoát","Nông nghiệp bắt đầu","Dân du mục, Cách mạng Đá mới và Vùng Lưỡi liềm Màu mỡ","Dân du mục","Những người di chuyển từ nơi này sang nơi khác để tìm thức ăn, nước và đồng cỏ cho gia súc.","Người săn bắt hái lượm","Con người thời đầu săn thú và hái cây dại.","Cách mạng Đá mới","Bước chuyển lớn từ săn bắt hái lượm sang trồng trọt.","Thặng dư","Lương thực dư ra. Nhờ đó một số người có thể làm việc khác như làm đồ gốm hoặc cai trị.","Khu định cư lâu dài","Một ngôi làng nơi người dân ở lại vì trồng thức ăn gần đó.","Vùng Lưỡi liềm Màu mỡ","Một vùng đất cong, giàu dinh dưỡng ở Tây Nam Á, nơi nông nghiệp bắt đầu.","Một nhóm người thời cổ thu dọn đồ đạc và theo bầy thú đến đồng cỏ mới. Vì sao họ di chuyển?","Để đáp ứng nhu cầu sinh tồn như thức ăn, nước và đồng cỏ","Để thu thuế các làng khác","Để xây một ngôi đền ở thành phố mới","Để buôn bán với La Mã","Dân du mục di chuyển để đáp ứng nhu cầu sinh tồn. Thức ăn và nước của họ phụ thuộc vào vùng đất xung quanh.","Thay đổi lớn nhất của Cách mạng Đá mới là gì?","Con người bắt đầu trồng trọt và chăn nuôi thay vì chỉ săn bắt và hái lượm","Con người phát minh ra máy in","Con người xây dựng đế quốc đầu tiên","Con người khám phá ra lửa lần đầu tiên","Cách mạng Đá mới là sự khởi đầu của nông nghiệp. Nó thay đổi cách con người sống.","Thật hay bịa? Nông nghiệp cho phép con người ở yên một chỗ và xây làng cố định.","Cây trồng mọc ở một chỗ, nên con người có thể ở lại và xây làng gần đồng ruộng.","Sắp xếp theo thứ tự: nông nghiệp đã thay đổi xã hội như thế nào.","Con người bắt đầu trồng trọt","Nông trại tạo ra lương thực dư (thặng dư)","Một số người làm việc khác, như thợ gốm hoặc thầy tu","Làng phát triển thành thành phố","Nông nghiệp tạo ra thặng dư. Nhờ thặng dư, không phải ai cũng phải làm nông, nên nghề nghiệp chuyên môn hóa và thành phố lớn lên.","Hãy xem bản đồ. Điều gì giúp nông nghiệp bắt đầu ở Vùng Lưỡi liềm Màu mỡ?","Các con sông và đất đai màu mỡ","Những ngọn núi cao ở giữa","Một sa mạc khô cằn rộng lớn","Đất đóng băng quanh năm","Vùng đất gần sông Tigris và Euphrates có nước và đất giàu dinh dưỡng, rất lý tưởng cho cây trồng.","Ghép mỗi thuật ngữ với nghĩa của nó.","Di chuyển để tìm thức ăn và nước","Lương thực dư ra","Sự khởi đầu của nông nghiệp","Săn thú và hái cây","Bốn ý này giải thích con người đã chuyển từ đi lang thang sang sống ở một nơi cố định như thế nào.","Các nền văn minh lưu vực sông","Lưỡng Hà, Ai Cập, thung lũng sông Ấn và Trung Hoa nhà Thương","Lưỡng Hà","\"Vùng đất giữa các con sông\": Tigris và Euphrates.","Ai Cập","Phát triển bên sông Nile. Do các pharaoh cai trị.","Thung lũng sông Ấn","Phát triển bên sông Ấn. Nổi tiếng với các thành phố được quy hoạch.","Trung Hoa nhà Thương","Phát triển bên Hoàng Hà (sông Vàng).","Chữ hình nêm","Chữ viết bằng các nét hình nêm trên đất sét. Được phát minh ở Lưỡng Hà.","Đặc điểm của một nền văn minh","Thành phố, chính quyền, tôn giáo, các tầng lớp xã hội, chữ viết, nghệ thuật và kiến trúc, và các nghề chuyên môn.","Thần quyền","Chính quyền do người có quyền lực tôn giáo đứng đầu. Pharaoh vừa là vua vừa là thầy tế cả.","Bản đồ đánh dấu bốn nền văn minh cổ đại. Điều gì giúp tất cả cùng phát triển?","Các con sông gần đó cung cấp nước và đất giàu dinh dưỡng","Các đại dương gần đó giúp họ buôn bán với châu Âu","Những ngọn núi ngăn người nước ngoài vào","Những khu rừng rậm cung cấp gỗ","Cả bốn nền văn minh bắt đầu ở các thung lũng sông. Sông cung cấp nước cho cây trồng, và lũ để lại đất màu mỡ.","Ghép mỗi nền văn minh với con sông của nó.","Sông Nile","Tigris và Euphrates","Sông Ấn","Hoàng Hà (sông Vàng)","Tên các con sông là câu hỏi thường gặp trong bài kiểm tra. Hãy nhớ: mỗi nền văn minh phát triển bên con sông của mình.","Một vị vua được tin là thần và cũng là thầy tế cả. Điều này mô tả hai loại chính quyền nào?","Quân chủ và thần quyền","Dân chủ và cộng hòa","Đầu sỏ và vô chính phủ","Bộ lạc và cộng hòa","Một vị vua nghĩa là quân chủ. Một người cai trị đồng thời là lãnh tụ tôn giáo nghĩa là thần quyền.","Danh sách nào cho thấy các đặc điểm của một nền văn minh?","Thành phố, chính quyền, chữ viết và các tầng lớp xã hội","Hang động, săn bắn và lửa","Lều, đàn gia súc và cuộc sống lang thang","Chỉ có nông trại và không có chính quyền","Các nền văn minh có thành phố, chính quyền, tôn giáo, tầng lớp xã hội, chữ viết, nghệ thuật và nghề chuyên môn.","Thật hay bịa? Chữ hình nêm được phát minh ở Ai Cập.","Chữ hình nêm đến từ Lưỡng Hà (Sumer). Ai Cập dùng chữ tượng hình.","Một bức tranh Maya cho thấy một người cai trị được khiêng đi trong khi người hầu đi bên cạnh. Điều này cho thấy đặc điểm nào của nền văn minh?","Các tầng lớp xã hội","Một hệ thống giáo dục","Một bộ luật","Đô thị hóa","Những người ở các cấp bậc khác nhau (người cai trị và người hầu) cho thấy các tầng lớp xã hội.","Sắp xếp theo thứ tự: sông Nile đã giúp Ai Cập phát triển như thế nào.","Sông Nile tràn bờ mỗi năm","Lũ để lại đất màu mỡ","Nông dân thu hoạch nhiều lương thực dư","Thành phố và chính quyền phát triển","Lũ dẫn đến thành công trong nông nghiệp. Lương thực dư tạo điều kiện cho thành phố và chính quyền.","Những niềm tin và tư tưởng lớn","Khổng Tử, Phật giáo, Ấn Độ giáo, Do Thái giáo, Cơ Đốc giáo và Hồi giáo","Khổng Tử","Nhà tư tưởng Trung Hoa. Dạy về đạo đức, sự kính trọng người lớn tuổi và làm tròn bổn phận.","Phật giáo","Bắt đầu ở Ấn Độ với Siddhartha Gautama, tức Đức Phật. Được truyền bá bởi các nhà sư, thương nhân và các vị vua như Ashoka.","Ấn Độ giáo","Bắt đầu ở Ấn Độ. Tin vào nhiều vị thần, luân hồi và nghiệp.","Do Thái giáo","Tin vào một Thượng đế duy nhất (độc thần). Kinh thánh là Torah.","Cơ Đốc giáo","Dựa trên Giê-su ở Nazareth. Lan rộng khắp Đế quốc La Mã.","Hồi giáo","Dựa trên nhà tiên tri Muhammad. Sách thánh là Kinh Qur'an. Tín đồ thực hành Năm Trụ cột.","Một viên quan Trung Hoa cổ đại theo Khổng Tử. Hành vi nào phù hợp?","Kính trọng người lớn tuổi và làm tròn bổn phận một cách trung thực","Hoàn toàn phớt lờ hoàng đế","Đặt lợi ích riêng lên trước","Thiền định để thoát khỏi luân hồi","Khổng Tử nhấn mạnh đạo đức, sự kính trọng và bổn phận để xây dựng một xã hội trật tự.","Câu nào giải thích Phật giáo lan ra ngoài Ấn Độ như thế nào?","Các nhà sư đi cùng thương nhân, và một số vua cử các nhà truyền giáo","Quân đội ép buộc người dân cải đạo","Máy in tạo ra hàng nghìn bản lời Đức Phật","Các nhà thám hiểm Tây Ban Nha mang nó đi bằng tàu","Phật giáo lan truyền hòa bình dọc các tuyến thương mại cùng các nhà sư và thương nhân. Hoàng đế Ashoka cũng ủng hộ các phái đoàn truyền giáo.","Ghép mỗi tôn giáo với một ý chính.","Torah","Kinh Qur'an","Luân hồi và nghiệp","Giê-su ở Nazareth","Mỗi tôn giáo có văn bản hoặc nhân vật trung tâm riêng.","Thật hay bịa? Do Thái giáo, Cơ Đốc giáo và Hồi giáo đều là độc thần.","Độc thần là tin vào một Thượng đế duy nhất. Ba tôn giáo này cùng có điểm chung đó.","Tín đồ của tôn giáo nào thực hành Năm Trụ cột?","Nho giáo","Năm Trụ cột là đức tin, cầu nguyện, bố thí, nhịn ăn trong tháng Ramadan và hành hương đến Mecca.","Siddhartha Gautama được biết đến là …","Đức Phật","Muhammad","Ashoka","Siddhartha Gautama trở thành Đức Phật, nghĩa là \"người đã giác ngộ\".","Hy Lạp cổ đại","Thành bang, dân chủ, văn hóa và di sản","Thành bang (polis)","Một thành phố có chính quyền và luật lệ riêng, như Athens hay Sparta.","Địa lý Hy Lạp","Núi và đảo ngăn cách các cộng đồng, nên nhiều thành bang độc lập đã hình thành.","Athens","Cái nôi của nền dân chủ trực tiếp. Chỉ nam giới trưởng thành là công dân mới được bỏ phiếu.","Sparta","Một xã hội quân sự huấn luyện các cậu bé thành chiến binh.","Socrates","Đặt câu hỏi và phân tích câu trả lời để tìm ra chân lý.","Hippocrates","Nghiên cứu bệnh tật bằng quan sát. Được gọi là \"cha đẻ của y học\".","Di sản của Hy Lạp","Dân chủ, triết học, sân khấu, Thế vận hội và kiến trúc có cột.","Vì sao nhiều thành bang độc lập hình thành ở Hy Lạp?","Núi và đảo ngăn cách các cộng đồng","Một đồng bằng phẳng rộng lớn nối liền cả vùng đất","Một vị vua hùng mạnh cai trị tất cả","Sa mạc bao quanh mỗi thành phố","Địa hình núi non và nhiều đảo khiến việc đi lại khó khăn. Mỗi cộng đồng tự cai quản.","Trong nền dân chủ Athens, ai được bỏ phiếu?","Chỉ nam giới trưởng thành là công dân","Tất cả người lớn trong thành phố","Chỉ gia đình nhà vua","Chỉ binh lính","Phụ nữ, người nước ngoài và nô lệ không được bỏ phiếu ở Athens.","Thật hay bịa? Sparta là một xã hội xây dựng trên huấn luyện quân sự.","Các cậu bé Sparta được huấn luyện thành binh lính từ nhỏ.","Những bức tượng Hy Lạp này cho biết gì về giá trị của người Hy Lạp?","Họ coi trọng vẻ đẹp và sự cân đối của cơ thể con người","Họ muốn tôn vinh một vị vua toàn quyền","Họ thờ một vị thần duy nhất","Họ muốn cảnh báo về cuộc sống sau khi chết","Nghệ thuật Hy Lạp thường ca ngợi cơ thể con người với sự cân đối và vẻ đẹp.","Ghép mỗi người hoặc nơi chốn với mô tả của nó.","Đặt câu hỏi để tìm chân lý","Nghiên cứu bệnh tật bằng quan sát","Dân chủ trực tiếp","Huấn luyện quân sự","Những cái tên này cho thấy đóng góp của người Hy Lạp cho tư duy, y học và chính quyền.","Điều nào sau đây là di sản của Hy Lạp cổ đại?","Thế vận hội","Vạn Lý Trường Thành","Chữ hình nêm","Các kim tự tháp","Thế vận hội đầu tiên được tổ chức ở Hy Lạp. Nhiều ý tưởng hiện đại bắt nguồn từ Hy Lạp.","Ở Athens phụ nữ không được bỏ phiếu, nhưng phụ nữ Sparta có thể sở hữu tài sản. Điều này cho thấy gì?","Các thành bang Hy Lạp đối xử với phụ nữ khác nhau","Mọi phụ nữ Hy Lạp có quyền như nam giới","Athens cho phụ nữ nhiều tự do hơn Sparta","Hy Lạp không có tầng lớp xã hội","Các thành bang độc lập, nên quy định về phụ nữ khác nhau. Không nơi nào trao cho phụ nữ đầy đủ quyền chính trị.","La Mã","Cộng hòa, Đế quốc, thành tựu La Mã và sự sụp đổ của La Mã","Cộng hòa La Mã","Các nhà lãnh đạo được bầu và Viện Nguyên lão giúp cai trị. Không có vua.","Đế quốc La Mã","Do các hoàng đế cai trị, bắt đầu từ Augustus.","Hòa bình La Mã (Pax Romana)","Khoảng 200 năm hòa bình và ổn định trong Đế quốc La Mã.","Luật La Mã","Những ý tưởng như \"vô tội cho đến khi bị chứng minh có tội\" vẫn ảnh hưởng đến luật pháp ngày nay.","Kỹ thuật La Mã","Đường sá, cầu và cống dẫn nước đưa nước vào các thành phố.","Tiếng Latinh","Ngôn ngữ của La Mã. Là gốc của tiếng Tây Ban Nha, Pháp và Ý.","Sự sụp đổ của La Mã","Lãnh đạo yếu kém, tham nhũng, nội chiến, khó khăn kinh tế và các cuộc xâm lược.","Dưới nền Cộng hòa La Mã, ai nắm quyền lực?","Các quan chức được bầu và Viện Nguyên lão","Một vị vua toàn quyền","Chỉ các thầy tu","Các tướng lĩnh nước ngoài","Cộng hòa là chính quyền của các nhà lãnh đạo được bầu và một Viện Nguyên lão, không phải của một vị vua.","Trong thời Hòa bình La Mã, điều gì có nhiều khả năng xảy ra nhất?","Thương mại và đi lại tăng nhờ hòa bình và đường sá tốt","Thương mại ngừng lại vì chiến tranh liên miên","La Mã mất hết đường sá","Viện Nguyên lão biến mất","Pax Romana nghĩa là hòa bình La Mã. Hòa bình và đường sá giúp thương mại phát triển.","Sắp xếp các sự kiện này theo thứ tự.","Augustus trở thành hoàng đế đầu tiên","Đế quốc Tây La Mã sụp đổ","La Mã chuyển từ Cộng hòa sang Đế quốc, hưởng hòa bình, rồi sụp đổ ở phía Tây.","Thật hay bịa? Các kỹ sư La Mã xây đường và cống dẫn nước tồn tại hàng trăm năm.","Nhiều con đường và cống dẫn nước La Mã được xây tốt đến mức một số đoạn vẫn còn đứng đến ngày nay.","Vấn đề nào đã làm suy yếu cả La Mã và nhà Hán Trung Hoa trước khi sụp đổ?","Lãnh đạo yếu kém, tham nhũng và các cuộc tấn công từ bên ngoài","Quá nhiều dân chủ","Quá nhiều mùa màng","Thương mại đột ngột chấm dứt hoàn toàn","Cả hai đế quốc đều chịu tham nhũng, bất ổn chính trị và các cuộc xâm lược.","Dưới Đế quốc La Mã, phụ nữ có thể sở hữu tài sản và điều hành kinh doanh, nhưng vẫn chịu sự giám hộ của một người đàn ông. Kết luận nào phù hợp?","Quyền của phụ nữ tăng lên nhưng chưa ngang bằng với nam giới","Phụ nữ và nam giới có quyền bằng nhau","Quyền của phụ nữ biến mất hoàn toàn","Phụ nữ có thể trở thành nữ hoàng đế","Bằng chứng cho thấy quyền tăng lên và vẫn còn những giới hạn.","Ghép mỗi ý tưởng La Mã với nghĩa của nó.","Gốc của tiếng Tây Ban Nha, Pháp và Ý","Cống dẫn nước","Đưa nước vào các thành phố","Vô tội cho đến khi bị chứng minh có tội","Viện Nguyên lão","Tư vấn và làm luật trong thời Cộng hòa","Người La Mã để lại những ý tưởng bền vững về ngôn ngữ, kỹ thuật và luật pháp.","Châu Âu thời Trung cổ","Giáo hội, Đế quốc Byzantine, chế độ phong kiến và các thái ấp","Giáo hội Công giáo La Mã","Do Giáo hoàng đứng đầu. Là tổ chức mạnh nhất ở Tây Âu thời Trung cổ.","Đế quốc Byzantine","Đế quốc La Mã phương Đông. Thủ đô: Constantinople. Cơ Đốc giáo là quốc giáo.","Giáo hội Chính thống giáo Đông phương","Giáo hội Cơ Đốc của thế giới Byzantine, do Constantinople lãnh đạo.","Chế độ phong kiến","Các lãnh chúa cấp đất cho hiệp sĩ để đổi lấy lòng trung thành và sự phục vụ. Nông dân cày cấy trên đất đó.","Thái ấp","Một điền trang tự cung tự cấp. Nền kinh tế dựa vào nông nghiệp.","Nông nô","Nông dân làm việc trên đất của lãnh chúa và không được rời đi.","Charlemagne","Vua người Frank được Giáo hoàng trao vương miện hoàng đế vào năm 800.","Không có vua mạnh ở gần, một ngôi làng tìm đến linh mục để xin giúp đỡ và duy trì trật tự. Điều này cho thấy Giáo hội là …","một lực lượng ổn định khi chính quyền yếu kém","một lực lượng tránh xa các vấn đề xã hội","tách biệt khỏi chính quyền","một nhóm chia rẽ châu Âu","Giáo hội mang đến cho người dân trật tự, sự giúp đỡ và một đức tin chung.","Hãy xem thái ấp này. Nguồn của cải chính là gì?","Nông nghiệp và chăn nuôi","Ngân hàng và cho vay","Các xưởng phường hội trong thành phố","Thương mại hải ngoại","Phần lớn thái ấp là đồng ruộng và đồng cỏ. Nông nô trồng lương thực và cối xay nghiền ngũ cốc.","Sắp xếp chế độ phong kiến từ trên xuống dưới.","Vua","Lãnh chúa và quý tộc","Hiệp sĩ","Nông dân và nông nô","Vua cấp đất cho lãnh chúa, lãnh chúa cấp cho hiệp sĩ, và nông dân cày cấy trên đất.","Đế quốc nào giữ Cơ Đốc giáo là quốc giáo và có thủ đô ở Constantinople?","Đế quốc Byzantine","Đế quốc Mông Cổ","Đế quốc Hán","Đế quốc Maurya","Chính quyền ủng hộ Cơ Đốc giáo, điều này giúp tôn giáo lan rộng.","Thật hay bịa? Giáo hoàng là lãnh đạo của Giáo hội Chính thống giáo Đông phương.","Giáo hoàng lãnh đạo Giáo hội Công giáo La Mã. Giáo hội Chính thống giáo do Constantinople lãnh đạo.","Đất đai đổi lấy lòng trung thành và sự phục vụ","Điền trang nông nghiệp tự cung tự cấp","Được trao vương miện hoàng đế năm 800","Thủ đô ở Constantinople","Đây là những ý tưởng cốt lõi của châu Âu thời Trung cổ.","Một nông nô trên thái ấp thời Trung cổ là …","một nông dân làm việc trên đất của lãnh chúa để đổi lấy sự bảo vệ","một hiệp sĩ bảo vệ lâu đài","một thương nhân đi trên Con đường Tơ lụa","một linh mục thu thuế","Nông nô cày cấy đất của lãnh chúa và được ông bảo vệ, nhưng thường không thể rời đi.","Hồi giáo và Thời đại Hoàng kim","Sự lan rộng của Hồi giáo, học thuật ở Baghdad và sự lan truyền văn hóa","Nhà tiên tri đã khởi xướng Hồi giáo ở Ả Rập.","Kinh Qur'an","Sách thánh của Hồi giáo.","Năm Trụ cột","Đức tin, cầu nguyện, bố thí, nhịn ăn trong tháng Ramadan, hành hương đến Mecca.","Quốc vương Hồi giáo (Caliphate)
