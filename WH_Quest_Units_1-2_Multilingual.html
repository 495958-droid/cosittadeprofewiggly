<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World History Quest: Units 1 and 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#4B9CD3;--blue2:#2f7fb8;--navy:#0e2a47;--sky:#eaf4fb;--ok:#1b8a4b;--okbg:#e2f6e9;--bad:#c0392b;--badbg:#fbe6e3;--gold:#ffc83d}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;min-height:100vh;font-family:Lexend,'Noto Sans Bengali','Noto Sans Arabic','Noto Sans SC','Nirmala UI','Segoe UI','Tahoma','Microsoft YaHei','PingFang SC',system-ui,sans-serif;color:var(--navy);background:#f3f8fc;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.top{background:linear-gradient(160deg,#6db3e0,#4B9CD3 60%,#3a88c0);color:#fff;padding:.7rem 1rem}
.top .in{max-width:46rem;margin:0 auto;display:flex;align-items:center;gap:.6rem}
.top h1{font-size:1.05rem;margin:0;flex:1;font-weight:600}
.chip{background:rgba(255,255,255,.22);border-radius:2rem;padding:.25rem .8rem;font-size:.85rem;font-weight:600;white-space:nowrap}
.wrap{max-width:46rem;margin:0 auto;padding:1rem}
.card{background:#fff;border-radius:1.1rem;padding:1rem 1.1rem;box-shadow:0 .15rem .8rem rgba(14,42,71,.12)}
.btn{font-size:1rem;font-weight:600;border-radius:.9rem;padding:.75rem 1.2rem;cursor:pointer;background:#fff;color:var(--navy);border:.15rem solid var(--navy)}
.btn:hover{background:var(--sky)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:#17406a}
.btn.wide{width:100%;font-size:1.1rem;padding:.9rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hero{display:grid;gap:.6rem}
.lvl{display:flex;align-items:center;gap:.8rem}
.lvl .badge{width:3rem;height:3rem;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:1.5rem;flex:none}
.lvl .nm{font-weight:700;font-size:1.1rem}
.bar{height:.7rem;background:#dbe9f4;border-radius:1rem;overflow:hidden}
.bar>div{height:100%;background:var(--blue2);border-radius:1rem;transition:width .4s}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:.9rem 0}
.tile{background:#fff;border:.15rem solid #cfe1ee;border-radius:1rem;padding:.7rem .4rem;text-align:center;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--navy)}
.tile:hover{border-color:var(--blue2);background:var(--sky)}
.tile .ic{font-size:1.5rem;display:block;margin-bottom:.15rem}
.tile:disabled{opacity:.45;cursor:not-allowed}
h2{margin:1.1rem 0 .5rem;font-size:1.15rem}
.zone{display:flex;gap:.8rem;align-items:center;margin-bottom:.6rem}
.zone .num{flex:none;width:3rem;height:3rem;border-radius:50%;background:var(--sky);border:.15rem solid var(--blue);display:grid;place-items:center;font-size:1.4rem}
.zone.done .num{background:var(--gold);border-color:#c79200}
.zone .info{flex:1;min-width:0}
.zone .zn{font-weight:700}
.zone .bl{font-size:.82rem;color:#4a6782}
.stars{font-size:1.1rem;letter-spacing:.1rem;color:#c8d6e2}
.stars .on{color:#e0a500}
.zbtns{display:flex;gap:.4rem;flex:none}
.zbtns .btn{padding:.5rem .8rem;font-size:.9rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.6rem}
.bdg{background:#fff;border-radius:.9rem;padding:.7rem;text-align:center;font-size:.8rem;border:.12rem solid #cfe1ee}
.bdg .ic{font-size:1.8rem;display:block}
.bdg.off{opacity:.4;filter:grayscale(1)}
.bdg b{display:block;font-size:.85rem}
.note{font-size:.8rem;color:#587490;text-align:center;margin:1.2rem 0}
.tr{display:block;color:#1d5c8e;font-weight:500;font-size:.92em;margin-top:.2rem;line-height:1.5}
.qtext .tr{font-size:.82em}
.fcard .tr{font-size:.8em;margin-top:.5rem}
.sel{font:inherit;font-size:1rem;padding:.55rem .7rem;border-radius:.7rem;border:.15rem solid var(--navy);width:100%;margin:.3rem 0 .5rem;background:#fff;color:var(--navy)}
.tog{display:flex;gap:.5rem;align-items:center;font-size:.9rem;cursor:pointer}
.tog input{width:1.1rem;height:1.1rem}
/* lesson */
.lhead{display:flex;align-items:center;gap:.8rem;margin-bottom:.9rem}
.x{background:none;border:0;font-size:1.4rem;color:#6a8399;cursor:pointer}
.prog{flex:1;height:.9rem;background:#dbe9f4;border-radius:1rem;overflow:hidden}
.prog>div{height:100%;background:var(--ok);border-radius:1rem;transition:width .4s}
.hearts{color:var(--bad);font-size:1.2rem;font-weight:700;letter-spacing:.05rem;white-space:nowrap}
.hearts .gone{color:#d6dde3}
.lbody{padding-bottom:9rem}
.kind{font-size:.8rem;font-weight:700;color:var(--blue2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem}
.qtext{font-size:1.3rem;line-height:1.4;margin:.2rem 0 .9rem;font-weight:600}
.qimg{width:100%;max-height:42vh;object-fit:contain;background:#fff;border:.1rem solid #d7e6f1;border-radius:.7rem;margin-bottom:.9rem;cursor:zoom-in}
.opts{display:grid;gap:.6rem}
.opt{display:flex;gap:.8rem;align-items:center;text-align:start;font-size:1.05rem;line-height:1.35;padding:.8rem .9rem;border-radius:.9rem;border:.15rem solid #c3d9e9;background:#fff;color:var(--navy);cursor:pointer;width:100%}
.opt:hover{border-color:var(--blue2);background:var(--sky)}
.opt .L{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--sky);border:.1rem solid #9cc4e0;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt.sel{border-color:var(--navy);background:#d9ebf8}
.opt.sel .L{background:var(--navy);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{border-color:var(--bad);background:var(--badbg)}.opt.no .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.plain{opacity:.7}
.opt.ok::after{content:"\2713";margin-inline-start:auto;color:var(--ok);font-weight:700;font-size:1.3rem}
.opt.no::after{content:"\2717";margin-inline-start:auto;color:var(--bad);font-weight:700;font-size:1.3rem}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.tfrow .opt{justify-content:center;font-size:1.3rem;font-weight:700;padding:1.2rem}
.slots{display:grid;gap:.5rem;margin-bottom:1rem}
.slot{display:flex;align-items:center;gap:.7rem;min-height:3rem;border:.15rem dashed #9cc4e0;border-radius:.8rem;padding:.4rem .6rem;background:#fafdff}
.slot .n{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--sky);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.slot .chipb{flex:1}
.pool{display:flex;flex-wrap:wrap;gap:.5rem}
.chipb{font-size:.98rem;padding:.55rem .8rem;border-radius:.8rem;border:.15rem solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;text-align:start;line-height:1.3}
.chipb:hover{background:var(--sky)}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.slot.no{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1rem}
.mt .col{display:grid;gap:.5rem;align-content:start}
.mi{position:relative;font-size:.95rem;line-height:1.3;text-align:start;padding:.65rem .7rem;padding-inline-start:2.1rem;border-radius:.8rem;border:.15rem solid #c3d9e9;background:#fff;color:var(--navy);cursor:pointer;min-height:3rem}
.mi.sel{border-color:var(--navy);background:#d9ebf8}
.mi .pn{position:absolute;inset-inline-start:.5rem;top:50%;transform:translateY(-50%);width:1.3rem;height:1.3rem;border-radius:50%;background:var(--sky);border:.1rem solid #9cc4e0;font-size:.75rem;font-weight:700;display:grid;place-items:center}
.mi.m .pn{background:var(--navy);color:#fff;border-color:var(--navy)}
.mi.ok{border-color:var(--ok);background:var(--okbg)}.mi.no{border-color:var(--bad);background:var(--badbg)}
.hint{font-size:.85rem;color:#587490;margin:.2rem 0 .7rem}
.fb{position:fixed;left:0;right:0;bottom:0;padding:1rem;border-top:.2rem solid;z-index:20}
.fb .in{max-width:46rem;margin:0 auto}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.no{background:var(--badbg);border-color:var(--bad)}
.fb h3{margin:0 0 .3rem;font-size:1.2rem}
.fb.ok h3{color:var(--ok)}.fb.no h3{color:var(--bad)}
.fb p{margin:.2rem 0 .8rem;font-size:.95rem;line-height:1.4}
.fb .ans{font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:0;padding:1rem;background:#f3f8fc;border-top:.1rem solid #d7e6f1;z-index:20}
.dock .in{max-width:46rem;margin:0 auto}
/* result */
.res{text-align:center;padding:1.5rem 1rem}
.res .big{font-size:3rem;letter-spacing:.3rem}
.res .big .on{color:#e0a500}.res .big .off{color:#c8d6e2}
.res h2{font-size:1.6rem;margin:.3rem 0}
.stat{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}
.stat div{background:#fff;border-radius:.9rem;padding:.6rem 1rem;box-shadow:0 .1rem .5rem rgba(14,42,71,.12);min-width:6rem}
.stat b{display:block;font-size:1.4rem}
.newb{background:#fff8dc;border:.15rem solid #e0b400;border-radius:1rem;padding:.7rem 1rem;margin:1rem 0}
.btnrow{display:grid;gap:.6rem;margin-top:1rem}
/* facts + cards */
.fact{margin-bottom:.6rem}
.fact b{color:var(--blue2)}
.fcard{min-height:14rem;display:grid;place-items:center;text-align:center;font-size:1.5rem;font-weight:600;padding:1.5rem;cursor:pointer;line-height:1.35}
.fcard.back{background:#fff8dc;font-size:1.25rem}
.fcard small{display:block;font-size:.8rem;color:#587490;font-weight:500;margin-bottom:.6rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.cb{font-size:.82rem;border:.12rem solid var(--navy);background:#fff;color:var(--navy);border-radius:2rem;padding:.3rem .7rem;cursor:pointer}
.cb.on{background:var(--navy);color:#fff}
.timer{height:.7rem;background:#dbe9f4;border-radius:1rem;overflow:hidden;margin-bottom:.6rem}
.timer>div{height:100%;background:var(--blue2)}
.timer.low>div{background:var(--bad)}
.sprow{display:flex;justify-content:space-between;font-weight:700;margin-bottom:.4rem}
.modal{position:fixed;inset:0;background:rgba(5,20,40,.55);display:grid;place-items:center;z-index:50;padding:1rem}
.modal .card{max-width:22rem;text-align:center}
.zoom{position:fixed;inset:0;background:rgba(5,20,40,.92);display:grid;place-items:center;z-index:60;cursor:zoom-out;padding:1rem}
.zoom img{max-width:96vw;max-height:94vh;background:#fff;border-radius:.5rem}
.confetti{position:fixed;top:-2rem;width:.7rem;height:1rem;z-index:70;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:520px){.zone{flex-wrap:wrap}.zbtns{width:100%}.zbtns .btn{flex:1}.mt{gap:.5rem}.mi{font-size:.88rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="wrap" id="app"></div>

const ZONES=[
{id:'z1',icon:'🌾',name:'Farming Begins',blurb:'Nomads, the Neolithic Revolution and the Fertile Crescent',
 facts:[['Nomads','People who move from place to place to find food, water and grazing land.'],
  ['Hunter-gatherers','Early people who hunted animals and gathered wild plants.'],
  ['Neolithic Revolution','The big change from hunting and gathering to farming.'],
  ['Surplus','Extra food. It lets some people do other jobs, like making pottery or leading.'],
  ['Permanent settlement','A village where people stay because they grow food nearby.'],
  ['Fertile Crescent','A curved region of rich land in Southwest Asia where farming began.']],
 qs:[
  mc("A group of early people packs up and follows a herd of animals to new grass. Why do they move?","To meet survival needs like food, water and grazing land",["To collect taxes from other villages","To build a temple in a new city","To trade with Rome"],"Nomads moved to meet survival needs. Their food and water supply came from the land around them."),
  mc("What was the biggest change of the Neolithic Revolution?","People began farming and raising animals instead of only hunting and gathering",["People invented the printing press","People built the first empire","People first discovered fire"],"The Neolithic Revolution is the start of farming. It changed how people lived."),
  tf("Fact or Fib? Farming let people settle in one place and build permanent villages.",true,"Crops grow in one place, so people could stay and build villages near their fields."),
  ord("Put these in order: how farming changed society.",["People begin farming","Farms make extra food (a surplus)","Some people take other jobs, like potter or priest","Villages grow into cities"],"Farming made a surplus. A surplus meant not everyone had to farm, so jobs became specialized and cities grew."),
  mc("Look at the map. What helped farming begin in the Fertile Crescent?","Rivers and fertile soil",["Tall mountains in the center","A huge dry desert","Frozen ground all year"],"The land near the Tigris and Euphrates Rivers had water and rich soil, which is ideal for crops.",'fertile'),
  mat("Match each term with its meaning.",[["Nomads","Move to find food and water"],["Surplus","Extra food"],["Neolithic Revolution","The start of farming"],["Hunter-gatherers","Hunted animals and gathered plants"]],"These four ideas explain how humans moved from wandering to settled life.")
 ]},
{id:'z2',icon:'🏺',name:'River Valley Civilizations',blurb:'Mesopotamia, Egypt, the Indus Valley and Shang China',
 facts:[['Mesopotamia','"Land between the rivers": the Tigris and Euphrates.'],
  ['Egypt','Grew along the Nile River. Ruled by pharaohs.'],
  ['Indus Valley','Grew along the Indus River. Known for planned cities.'],
  ['Shang China','Grew along the Huang He (Yellow River).'],
  ['Cuneiform','Writing with wedge-shaped marks on clay. Invented in Mesopotamia.'],
  ['Characteristics of civilization','Cities, government, religion, social classes, writing, art and architecture, and specialized jobs.'],
  ['Theocracy','A government led by religious authority. The pharaoh was both king and chief priest.']],
 qs:[
  mc("The map marks four early civilizations. What helped all of them grow?","Nearby rivers that gave water and rich soil",["Nearby oceans where they traded with Europe","Mountains that kept out all outsiders","Thick forests that gave lumber"],"All four civilizations began in river valleys. Rivers meant water for crops, and floods left fertile soil.",'rivers'),
  mat("Match each civilization with its river.",[["Egypt","Nile River"],["Mesopotamia","Tigris and Euphrates"],["Indus Valley","Indus River"],["Shang China","Huang He (Yellow River)"]],"River names are a favorite test question. Remember: each civilization is named for or grew along its river."),
  mc("A king is also believed to be a god and the head priest. Which two types of government does this describe?","Monarchy and theocracy",["Democracy and republic","Oligarchy and anarchy","Tribe and republic"],"A king means monarchy. A ruler who is also a religious leader means theocracy."),

{id:'z3',icon:'📜',name:'Big Beliefs and Ideas',blurb:'Confucius, Buddhism, Hinduism, Judaism, Christianity and Islam',
 facts:[['Confucius','Chinese thinker. Taught moral conduct, respect for elders and doing your duty.'],
  ['Buddhism','Began in India with Siddhartha Gautama, the Buddha. Spread by monks, traders and rulers like Ashoka.'],
  ['Hinduism','Began in India. Believes in many gods, reincarnation and karma.'],
  ['Judaism','Belief in one God (monotheism). Holy text is the Torah.'],
  ['Christianity','Based on Jesus of Nazareth. Spread widely across the Roman Empire.'],
  ['Islam','Based on the prophet Muhammad. Holy book is the Quran. Followers follow the Five Pillars.']],
 qs:[
  mc("An official in ancient China follows Confucius. Which behavior fits?","Respecting his elders and doing his duty honestly",["Ignoring the emperor completely","Putting his own interests first","Meditating to escape rebirth"],"Confucius stressed moral conduct, respect and duty to build an orderly society."),
  mc("Which statement explains how Buddhism spread beyond India?","Monks traveled with merchants, and some rulers sent missionaries",["Armies forced people to convert","Printing presses made thousands of copies of the Buddha's words","Spanish explorers carried it by ship"],"Buddhism spread peacefully along trade routes with monks and merchants. Emperor Ashoka also supported missions."),
  mat("Match each religion with a key idea.",[["Judaism","The Torah"],["Islam","The Quran"],["Hinduism","Reincarnation and karma"],["Christianity","Jesus of Nazareth"]],"Each religion has its own central text or figure."),
  tf("Fact or Fib? Judaism, Christianity and Islam are all monotheistic.",true,"Monotheism is belief in one God. All three of these religions share it."),
  mc("Which religion's followers practice the Five Pillars?","Islam",["Hinduism","Buddhism","Confucianism"],"The Five Pillars are faith, prayer, charity, fasting in Ramadan and pilgrimage to Mecca."),
  mc("Siddhartha Gautama is known as …","the Buddha",["Confucius","Muhammad","Ashoka"],"Siddhartha Gautama became the Buddha, which means 'the awakened one.'")
 ]},
{id:'z4',icon:'🏛️',name:'Ancient Greece',blurb:'City-states, democracy, culture and legacy',
 facts:[['City-state (polis)','A city with its own government and laws, like Athens or Sparta.'],
  ['Greek geography','Mountains and islands separated communities, so many independent city-states formed.'],
  ['Athens','Home of direct democracy. Only adult male citizens could vote.'],
  ['Sparta','A military society that trained boys to be soldiers.'],
  ['Socrates','Asked questions and analyzed answers to look for truth.'],
  ['Hippocrates','Used observation to study illness. Called the "father of medicine".'],
  ['Greek legacy','Democracy, philosophy, theater, the Olympics and columned architecture.']],
 qs:[
  mc("Why did Greece develop many independent city-states?","Mountains and islands separated communities",["A huge flat plain united the land","One strong king ruled everything","Deserts surrounded every city"],"Rugged land and many islands made travel hard. Each community governed itself.",'greece'),
  mc("In Athenian democracy, who could vote?","Adult male citizens only",["Every adult in the city","Only the king's family","Only soldiers"],"Women, foreigners and slaves could not vote in Athens."),
  tf("Fact or Fib? Sparta was a society built around military training.",true,"Spartan boys trained to be soldiers from a young age."),
  mc("What do these Greek statues tell us about Greek values?","They valued the beauty and balance of the human form",["They wanted to glorify an all-powerful king","They worshipped only one god","They wanted to warn people about the afterlife"],"Greek art often celebrated the human body with balance and beauty.",'acro'),
  mat("Match each person or place with its description.",[["Socrates","Asked questions to find truth"],["Hippocrates","Studied illness by observation"],["Athens","Direct democracy"],["Sparta","Military training"]],"These names show Greek contributions in thinking, medicine and government."),
  mc("Which of these is a legacy of ancient Greece?","The Olympic Games",["The Great Wall","Cuneiform writing","Pyramids"],"The first Olympics took place in Greece. Many modern ideas come from Greece."),
  mc("Women in Athens could not vote, but Spartan women could own property. What does this show?","Greek city-states treated women differently",["All Greek women had equal rights to men","Athens gave women more freedom than Sparta","Greece had no social classes"],"The city-states were independent, so their rules about women differed. Neither gave women full political rights.")
 ]},
{id:'z5',icon:'🦅',name:'Rome',blurb:'Republic, Empire, Roman achievements and the fall of Rome',
 facts:[['Roman Republic','Leaders were elected and a Senate helped govern. No king.'],
  ['Roman Empire','Ruled by emperors beginning with Augustus.'],
  ['Pax Romana','About 200 years of peace and stability in the Roman Empire.'],
  ['Roman law','Ideas like "innocent until proven guilty" still shape law today.'],
  ['Roman engineering','Roads, bridges and aqueducts that carried water to cities.'],
  ['Latin','The language of Rome. It is the root of Spanish, French and Italian.'],
  ['Fall of Rome','Weak leaders, corruption, civil wars, economic problems and invasions.']],
 qs:[
  mc("Under the Roman Republic, who held power?","Elected officials and the Senate",["A single all-powerful king","Priests only","Foreign generals"],"The Republic was rule by elected leaders and a Senate, not by a king."),
  mc("During the Pax Romana, what most likely happened?","Trade and travel increased because of peace and good roads",["Trade stopped because of constant war","Rome lost its roads","The Senate disappeared"],"Pax Romana means Roman peace. Peace and roads helped trade grow."),
  ord("Put these events in order.",["Roman Republic","Augustus becomes the first emperor","Pax Romana","The western Empire falls"],"Rome moved from Republic to Empire, enjoyed peace, and then fell in the west."),
  tf("Fact or Fib? Roman engineers built roads and aqueducts that lasted for hundreds of years.",true,"Many Roman roads and aqueducts were so well built that parts still stand today."),
  mc("What problem hurt both Rome and Han China before their collapse?","Weak, corrupt leaders and attacks from outside groups",["Too much democracy","Too many harvests","A sudden end to all trade"],"Both empires faced corruption, political instability and invasions."),
  mc("Under the Roman Empire, women could own property and run businesses, but still lived under a man's guardianship. What conclusion fits?","Women's rights grew, but they were not equal to men's",["Women and men had equal rights","Women's rights completely disappeared","Women could become emperor"],"The evidence shows growth in rights and limits that remained."),
  mat("Match each Roman idea with its meaning.",[["Latin","Root of Spanish, French and Italian"],["Aqueduct","Carried water to cities"],["Roman law","Innocent until proven guilty"],["Senate","Advised and made laws in the Republic"]],"Romans left lasting ideas in language, engineering and law.")
 ]},
{id:'z6',icon:'🏰',name:'Medieval Europe',blurb:'The Church, the Byzantine Empire, feudalism and manors',
 facts:[['Roman Catholic Church','Led by the pope. The strongest institution in medieval Western Europe.'],
  ['Byzantine Empire','The eastern Roman Empire. Capital: Constantinople. Christianity was the state religion.'],
  ['Eastern Orthodox Church','The Christian church of the Byzantine world, led from Constantinople.'],
  ['Feudalism','Lords gave land to knights for loyalty and service. Peasants worked the land.'],
  ['Manor','A self-sufficient estate. Its economy was based on farming.'],
  ['Serf','A peasant who worked the lord\'s land and could not leave.'],
  ['Charlemagne','Frankish king crowned emperor by the pope in 800.']],
 qs:[
  mc("With no strong king nearby, a village turns to its priest for help and order. This shows the Church was …","a stabilizing force when governments were weak",["a force that avoided social matters","separate from government","a group that divided Europe"],"The Church gave people order, help and a shared faith."),
  mc("Look at this manor. What was the main source of wealth?","Farming and raising animals",["Banking and loans","Guild workshops in cities","Overseas trade"],"Most of the manor is fields and pasture. Serfs grew food and the mill ground grain.",'manor'),
  ord("Order the feudal system from top to bottom.",["King","Lords and nobles","Knights","Peasants and serfs"],"The king gave land to lords, lords to knights, and peasants worked the land."),
  mc("Which empire kept Christianity as its state religion and had its capital at Constantinople?","The Byzantine Empire",["The Mongol Empire","The Han Empire","The Mauryan Empire"],"The government supported Christianity, which helped it spread."),
  tf("Fact or Fib? The pope was the leader of the Eastern Orthodox Church.",false,"The pope led the Roman Catholic Church. The Orthodox Church was led from Constantinople."),
  mat("Match each term with its meaning.",[["Feudalism","Land for loyalty and service"],["Manor","Self-sufficient farming estate"],["Charlemagne","Crowned emperor in 800"],["Byzantine Empire","Capital at Constantinople"]],"These are the core ideas of medieval Europe."),
  mc("A serf on a medieval manor was …","a peasant who worked the lord's land in exchange for protection",["a knight who defended the castle","a merchant who traveled on the Silk Road","a priest who collected taxes"],"Serfs farmed the lord's land and were protected by him, but they usually could not leave.")
 ]},
{id:'z7',icon:'🕌',name:'Islam and the Golden Age',blurb:'Spread of Islam, learning in Baghdad and cultural diffusion',
 facts:[['Muhammad','The prophet who began Islam in Arabia.'],
  ['Quran','The holy book of Islam.'],
  ['Five Pillars','Faith, prayer, charity, fasting in Ramadan, pilgrimage to Mecca.'],
  ['Caliphate','A Muslim empire led by a caliph. It spread Islam across three continents.'],
  ['Golden Age of Islam','A time of big advances in math, medicine and astronomy, especially in Baghdad.'],
  ['House of Wisdom','Baghdad center where scholars translated books and added new ideas.'],
  ['Algebra','Math advanced by Muslim scholars. We still use the system today.']],
 qs:[
  mc("Which statement is best supported by the map?","Islam spread outward from Arabia in stages across North Africa and Asia",["Islam stayed in Arabia","Islam's territory shrank from 750 to 1250","Over half the world was Muslim by 1250"],"The map shows later shading moving outward from the first area. It does not show population numbers.",'islam'),
  mc("Which Golden Age achievement helps you do math today?","Algebra and our number system",["Cuneiform","Aqueducts","Gunpowder"],"Muslim scholars built on Greek, Indian and Persian math and advanced algebra."),
  tf("Fact or Fib? The Quran is the holy book of Islam.",true,"The Quran is central to Islam."),
  mat("Match each term with its meaning.",[["Muhammad","The prophet who began Islam"],["Quran","Holy book of Islam"],["Mecca","Pilgrimage city"],["Baghdad","Center of learning"]],"These names show where and how Islam began and grew."),
  mc("Scholars in Baghdad translated Greek, Persian and Indian books and added new ideas. This is an example of …","cultural diffusion",["a theocracy","a surplus","feudalism"],"Cultural diffusion is the spread of ideas between cultures."),
  mc("Which is one of the Five Pillars of Islam?","Fasting during Ramadan",["Building pyramids","Daily animal sacrifice","Wearing a crown"],"The pillars are faith, prayer, charity, fasting and the pilgrimage to Mecca.")
 ]},
{id:'z8',icon:'⚔️',name:'Crusades and the Black Death',blurb:'How medieval Europe came to an end',
 facts:[['The Crusades','Wars (1096 to 1291) by Christian Europeans to take the Holy Land.'],
  ['Effects of the Crusades','More trade, cultural diffusion, weaker feudalism and stronger kings.'],
  ['Italian city-states','Venice and Genoa grew rich from trade with the East.'],
  ['Black Death','A plague in the 1340s that spread from Asia along trade routes.'],
  ['Black Death effects','Many died. Fewer workers weakened the manor system.'],
  ['Hundred Years\' War','England vs. France (1337 to 1453). New weapons weakened knights.'],
  ['End of the Middle Ages','The Crusades, the Black Death and the Hundred Years\' War all helped end medieval Europe.']],
 qs:[
  mc("A French knight returns from the Middle East with spices, silk and new ideas about medicine. What does this show?","Cultural diffusion",["The start of the Industrial Revolution","Europe becoming isolated","The start of colonies in the Americas"],"Contact between Europe and Muslim lands moved goods and ideas around."),
  ord("Put these in order: the effects of the Crusades.",["Trade routes open","More Asian luxury goods reach Europe","Italian trade cities grow rich","Western Europe's economy grows"],"Trade opened, goods arrived, trade cities grew, and the economy grew."),
  mc("The arrows on the map suggest the plague reached Europe along …","trade routes from Asia",["Viking raiding routes","ocean routes from the Americas","mountain passes from southern Africa"],"Merchants carried the disease along trade routes from Asia.",'plague'),
  tf("Fact or Fib? Because the Black Death killed so many workers, manors and lords lost power.",true,"Fewer workers meant survivors could demand better pay. That weakened the manor system."),
  mat("Match each event or place with its description.",[["The Crusades","Wars to take the Holy Land"],["Black Death","Plague spread on trade routes"],["Hundred Years' War","England vs. France"],["Venice and Genoa","Rich Italian trade cities"]],"These four items explain the end of the Middle Ages."),
  mc("Which three events helped bring an end to medieval Europe?","The Crusades, the Black Death and the Hundred Years' War",["The Pax Romana, the Silk Road and the Golden Age","The Neolithic Revolution, cuneiform and pyramids","Feudalism, manors and monasteries"],"These three events weakened feudalism and changed Europe."),
  mc("How did the Hundred Years' War help end the Middle Ages?","New weapons weakened knights, and kings gained power",["It made feudalism stronger","It ended all trade","It brought back the Roman Empire"],"Longbows and cannons made armored knights less important, and nations grew stronger.")
 ]},
{id:'z9',icon:'🐎',name:'Tang, Song and the Mongols',blurb:'Chinese dynasties, the Silk Road and the Mongol Empire',
 facts:[['Tang dynasty','Built roads and canals. Silk Road trade grew. Capital: Chang\'an.'],
  ['Song dynasty','Gunpowder weapons, moveable type printing, compass and paper money.'],
  ['Silk Road','Trade routes across Asia linking China to the Mediterranean.'],
  ['Genghis Khan','United the nomadic Mongol tribes and built a vast empire.'],
  ['Kublai Khan','Genghis\'s grandson. First non-Chinese ruler of all China. Founded the Yuan dynasty.'],
  ['Marco Polo','Venetian traveler. His book increased European interest in Asia.'],
  ['Mongol effects','Russia paid tribute. China: Yuan dynasty. Islamic world: Baghdad destroyed in 1258. Trade was safer.']],
 qs:[
  mc("Which challenge would a Silk Road trader on this map most likely face?","Long distances through deserts and mountains",["Easy travel on one paved road","Short trips between nearby ports","No need for cities along the way"],"The map shows routes crossing huge distances and rough land.",'silk'),
  mat("Match each ruler or dynasty with what it is known for.",[["Tang","Roads and canals"],["Song","Gunpowder and moveable type"],["Genghis Khan","United the Mongol tribes"],["Kublai Khan","Founded the Yuan dynasty"]],"These four are the main people and periods of this lesson."),
  tf("Fact or Fib? The Mongols made travel and trade across Asia safer.",true,"Mongol control of huge areas protected trade routes. People, goods and ideas moved farther."),
  mc("What happened to Baghdad in 1258?","The Mongols captured and destroyed much of the city",["The Crusaders captured it","The Black Death emptied it","It became the capital of China"],"The Mongol invasion of the Islamic world ended the Abbasid Caliphate."),
  mc("After Marco Polo's book spread, many Europeans …","became more interested in Asian cultures and goods",["stopped trading with Asia","moved to China","forgot about the Silk Road"],"Travelers' writings can spark curiosity and trade."),
  mc("Which was widely used in Song China?","Printing with moveable type",["Cuneiform writing on clay","Roman aqueducts","Viking longships"],"Song China printed with moveable type and used gunpowder weapons."),
  mc("How did the Mongols change Russia?","They ruled the Russian princes and collected tribute for about 200 years",["They built new Russian cities with Roman engineers","They made Russia the center of the Silk Road","They never reached Russia"],"The Mongol Golden Horde dominated Russia, and Russian princes paid tribute."),
  ord("Put these in order.",["Genghis Khan unites the Mongols","The Mongols conquer much of Asia","Kublai Khan founds the Yuan dynasty","Marco Polo visits China and writes a book"],"The empire grew under Genghis, reached China under Kublai, and Marco Polo told Europe about it.")
 ]}

od. All three of these religions share it.","Which religion's followers practice the Five Pillars?","Confucianism","The Five Pillars are faith, prayer, charity, fasting in Ramadan and pilgrimage to Mecca.","Siddhartha Gautama is known as …","the Buddha","Muhammad","Ashoka","Siddhartha Gautama became the Buddha, which means 'the awakened one.'","Ancient Greece","City-states, democracy, culture and legacy","City-state (polis)","A city with its own government and laws, like Athens or Sparta.","Greek geography","Mountains and islands separated communities, so many independent city-states formed.","Athens","Home of direct democracy. Only adult male citizens could vote.","Sparta","A military society that trained boys to be soldiers.","Socrates","Asked questions and analyzed answers to look for truth.","Hippocrates","Used observation to study illness. Called the \"father of medicine\".","Greek legacy","Democracy, philosophy, theater, the Olympics and columned architecture.","Why did Greece develop many independent city-states?","Mountains and islands separated communities","A huge flat plain united the land","One strong king ruled everything","Deserts surrounded every city","Rugged land and many islands made travel hard. Each community governed itself.","In Athenian democracy, who could vote?","Adult male citizens only","Every adult in the city","Only the king's family","Only soldiers","Women, foreigners and slaves could not vote in Athens.","Fact or Fib? Sparta was a society built around military training.","Spartan boys trained to be soldiers from a young age.","What do these Greek statues tell us about Greek values?","They valued the beauty and balance of the human form","They wanted to glorify an all-powerful king","They worshipped only one god","They wanted to warn people about the afterlife","Greek art often celebrated the human body with balance and beauty.","Match each person or place with its description.","Asked questions to find truth","Studied illness by observ ueducts that lasted for hundreds of years.","Many Roman roads and aqueducts were so well built that parts still stand today.","What problem hurt both Rome and Han China before their collapse?","Weak, corrupt leaders and attacks from outside groups","Too much democracy","Too many harvests","A sudden end to all trade","Both empires faced corruption, political instability and invasions.","Under the Roman Empire, women could own property and run businesses, but still lived under a man's guardianship. What conclusion fits?","Women's rights grew, but they were not equal to men's","Women and men had equal rights","Women's rights completely disappeared","Women could become emperor","The evidence shows growth in rights and limits that remained.","Match each Roman idea with its meaning.","Root of Spanish, French and Italian","Aqueduct","Carried water to cities","Innocent until proven guilty","Senate","Advised and made laws in the Republic","Romans left lasting ideas in language, engineering and law.","Medieval Europe","The Church, the Byzantine Empire, feudalism and manors","Roman Catholic Church","Led by the pope. The strongest institution in medieval Western Europe.","Byzantine Empire","The eastern Roman Empire. Capital: Constantinople. Christianity was the state religion.","Eastern Orthodox Church","The Christian church of the Byzantine world, led from Constantinople.","Feudalism","Lords gave land to knights for loyalty and service. Peasants worked the land.","Manor","A self-sufficient estate. Its economy was based on farming.","Serf","A peasant who worked the lord's land and could not leave.","Charlemagne","Frankish king crowned emperor by the pope in 800.","With no strong king nearby, a village turns to its priest for help and order. This shows the Church was …","a stabilizing force when governments were weak","a force that avoided social matters","separate from government","a group that divided Europe","The Church gave people order, help and a shared faith.","Look at this manor. What was the main source of wealth?","Farming and raising animals","Banking and loans","Guild workshops in cities","Overseas trade","Most of the manor is fields and pasture. Serfs grew food and the mill ground grain.","Order the feudal system from top to bottom.","King","Lords and nobles","Knights","Peasants and serfs","The king gave land to lords, lords to knights, and peasants worked the land.","Which empire kept Christianity as its state religion and had its capital at Constantinople?","The Byzantine Empire","The Mongol Empire","The Han Empire","The Mauryan Empire","The government supported Christianity, which helped it spread.","Fact or Fib? The pope was the leader of the Eastern Orthodox Church.","The pope led the Roman Catholic Church. The Orthodox Church was led from Constantinople.","Land for loyalty and service","Self-sufficient farming estate","Crowned emperor in 800","Capital at Constantinople","These are the core ideas of medieval Europe.","A serf on a medieval manor was …","a peasant who worked the lord's land in exchange for protection","a knight who defended the castle","a merchant who traveled on the Silk Road","a priest who collected taxes","Serfs farmed the lord's land and were protected by him, but they usually could not leave.","Islam and the Golden Age","Spread of Islam, learning in Baghdad and cultural diffusion","The prophet who began Islam in Arabia.","Quran","The holy book of Islam.","Five Pillars","Faith, prayer, charity, fasting in Ramadan, pilgrimage to Mecca.","Caliphate","A Muslim empire led by a caliph. It spread Islam across three continents.","Golden Age of Islam","A time of big advances in math, medicine and astronomy, especially in Baghdad.","House of Wisdom","Baghdad center where scholars translated books and added new ideas.","Algebra","Math advanced by Muslim scholars. We still use the system today.","Which statement is best supported by the map?","Islam spread outward from Arabia in stages across North Africa and Asia","Islam stayed in Arabia","Islam's territory shrank from 750 to 1250","Over half the world was Muslim by 1250","The map shows later shading moving outward from the first area. It does not show population numbers.","Which Golden Age achievement helps you do math today?","Algebra and our number system","Aqueducts","Gunpowder","Muslim scholars built on Greek, Indian and Persian math and advanced algebra.","Fact or Fib? The Quran is the holy book of Islam.","The Quran is central to Islam.","The prophet who began Islam","Holy book of Islam","Mecca","Pilgrimage city","Baghdad","Center of learning","These names show where and how Islam began and grew.","Scholars in Baghdad translated Greek, Persian and Indian books and added new ideas. This is an example of …","cultural diffusion","a theocracy","a surplus","feudalism","Cultural diffusion is the spread of ideas between cultures.","Which is one of the Five Pillars of Islam?","Fasting during Ramadan","Building pyramids","Daily animal sacrifice","Wearing a crown","The pillars are faith, prayer, charity, fasting and the pilgrimage to Mecca.","Crusades and the Black Death","How medieval Europe came to an end","The Crusades","Wars (1096 to 1291) by Christian Europeans to take the Holy Land.","Effects of the Crusades","More trade, cultural diffusion, weaker feudalism and stronger kings.","Italian city-states","Venice and Genoa grew rich from trade with the East.","Black Death","A plague in the 1340s that spread from Asia along trade routes.","Black Death effects","Many died. Fewer workers weakened the manor system.","Hundred Years' War","England vs. France (1337 to 1453). New weapons weakened knights.","End of the Middle Ages","The Crusades, the Black Death and the Hundred Years' War all helped end medieval Europe.","A French knight returns from the Middle East with spices, silk and new ideas about medicine. What does this show?","Cultural diffusion","The start of the Industrial Revolution","Europe becoming isolated","The start of colonies in the Americas","Contact between Europe and Muslim lands moved goods and ideas around.","Put these in order: the effects of the Crusades.","Trade routes open","More Asian luxury goods reach Europe","Italian trade cities grow rich","Western Europe's economy grows","Trade opened, goods arrived, trade cities grew, and the economy grew.","The arrows on the map suggest the plague reached Europe along …","trade routes from Asia","Viking raiding routes","ocean routes from the Americas","mountain passes from southern Africa","Merchants carried the disease along trade routes from Asia.","Fact or Fib? Because the Black Death killed so many workers, manors and lords lost power.","Fewer workers meant survivors could demand better pay. That weakened the manor system.","Match each event or place with its description.","Wars to take the Holy Land","Plague spread on trade routes","England vs. France","Venice and Genoa","Rich Italian trade cities","These four items explain the end of the Middle Ages.","Which three events helped bring an end to medieval Europe?","The Crusades, the Black Death and the Hundred Years' War","The Pax Romana, the Silk Road and the Golden Age","The Neolithic Revolution, cuneiform and pyramids","Feudalism, manors and monasteries","These three events weakened feudalism and changed Europe.","How did the Hundred Years' War help end the Middle Ages?","New weapons weakened knights, and kings gained power","It made feudalism stronger","It ended all trade","It brought back the Roman Empire","Longbows and cannons made armored knights less important, and nations grew stronger.","Tang, Song and the Mongols","Chinese dynasties, the Silk Road and the Mongol Empire","Tang dynasty","Built roads and canals. Silk Road trade grew. Capital: Chang'an.","Song dynasty","Gunpowder weapons, moveable type printing, compass and paper money.","Silk Road","Trade routes across Asia linking China to the Mediterranean.","Genghis Khan","United the nomadic Mongol tribes and built a vast empire.","Kublai Khan","Genghis's grandson. First non-Chinese ruler of all China. Founded the Yuan dynasty.","Marco Polo","Venetian traveler. His book increased European interest in Asia.","Mongol effects","Russia paid tribute. China: Yuan dynasty. Islamic world: Baghdad destroyed in 1258. Trade was safer.","Which challenge would a Silk Road trader on this map most likely face?","Long distances through deserts and mountains","Easy travel on one paved road","Short trips between nearby ports","No need for cities along the way","The map shows routes crossing huge distances and rough land.","Match each ruler or dynasty with what it is known for.","Tang","Roads and canals","Song","Gunpowder and moveable type","United the Mongol tribes","Founded the Yuan dynasty","These four are the main people and periods of this lesson.","Fact or Fib? The Mongols made travel and trade across Asia safer.","Mongol control of huge areas protected trade routes. People, goods and ideas moved farther.","What happened to Baghdad in 1258?","The Mongols captured and destroyed much of the city","The Crusaders captured it","The Black Death emptied it","It became the capital of China","The Mongol invasion of the Islamic world ended the Abbasid Caliphate.","After Marco Polo's book spread, many Europeans …","became more interested in Asian cultures and goods","stopped trading with Asia","moved to China","forgot about the Silk Road","Travelers' writings can spark curiosity and trade.","Which was widely used in Song China?","Printing with moveable type","Cuneiform writing on clay","Roman aqueducts","Viking longships","Song China printed with moveable type and used gunpowder weapons.","How did the Mongols change Russia?","They ruled the Russian princes and collected tribute for about 200 years","They built new Russian cities with Roman engineers","They made Russia the center of the Silk Road","They never reached Russia","The Mongol Golden Horde dominated Russia, and Russian princes paid tribute.","Put these in order.","Genghis Khan unites the Mongols","The Mongols conquer much of Asia","Kublai Khan founds the Yuan dynasty","Marco Polo visits China and writes a book","The empire grew under Genghis, reached China under Kublai, and Marco Polo told Europe about it."];
